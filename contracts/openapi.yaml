              minimum: 0
            today_unread:
              type: integer
              description: The messages of `today` the caller has not read.
              minimum: 0
            pending:
              type: integer
              description: Messages the caller starred outside `archive` and the trash, both directions.
              minimum: 0
            sent_waiting:
              type: integer
              description: Outbound messages waiting for room in the organization's send limit.
              minimum: 0
        roles:
          type: array
          description: One entry per mail role with at least one mailbox the caller may read, by `role_id`
            ascending.
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - role_id
              - unread
            properties:
              role_id:
                $ref: '#/components/schemas/PositiveID'
              unread:
                type: integer
                description: The `all_unread` of the role's readable mailboxes.
                minimum: 0
        ungrouped_unread:
          type: integer
          description: The `all_unread` of the readable mailboxes without a mail role.
          minimum: 0
        mailboxes:
          type: array
          description: One entry per mailbox the caller may read, by `mailbox_id` ascending. Each `unread`
            equals that mailbox's `unread_count`.
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - mailbox_id
              - unread
            properties:
              mailbox_id:
                $ref: '#/components/schemas/PositiveID'
              unread:
                type: integer
                minimum: 0
        today_starts_at:
          type: string
          format: date-time
          description: The start of today in the requested time zone, in UTC; inclusive.
        today_ends_at:
          type: string
          format: date-time
          description: The start of the next day in the requested time zone, in UTC; exclusive.
        triage:
          description: The caller's unread inbound messages in `default` by triage category; null while the
            organization's AI triage is off, which is how clients know to hide it.
          oneOf:
            - $ref: '#/components/schemas/InboxTriageCounts'
            - type: 'null'
    MailSource:
      type: string
      description: Where the message came from. `zmail` is mail Zmail itself received or sent; any other
        value is the id of the connector that synced a read-only copy from a bound outside account into
        an `external` mailbox, such as `gmail` or `outlook`. New connectors add values without a
        contract change, so clients render an unknown value generically.
      pattern: ^[a-z][a-z0-9_]{1,15}$
    ExternalMailConnectorID:
      type: string
      description: A connector id, such as `gmail` or `outlook`. The instance's connectors are listed by
        `GET /v1/external-mail-connectors`; new connectors add values without a contract change.
      pattern: ^[a-z][a-z0-9_]{1,15}$
    ExternalMailConnector:
      type: object
      additionalProperties: false
      required:
        - id
        - auth_kind
        - capabilities
      properties:
        id:
          $ref: '#/components/schemas/ExternalMailConnectorID'
        auth_kind:
          type: string
          description: How a member grants access; `oauth2` is the authorization code flow with PKCE.
          enum:
            - oauth2
        capabilities:
          type: object
          additionalProperties: false
          required:
            - read
          properties:
            read:
              type: boolean
              description: The connector syncs the account's mail into its external mailbox.
    ExternalMailConnectorListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ExternalMailConnector'
    StartExternalMailAuthorizationRequest:
      type: object
      additionalProperties: false
      description: Give `provider` to bind a new account, or `connection_id` to reconnect one of the
        caller's own connections (its provider is then implied; a different `provider` is refused).
      properties:
        provider:
          $ref: '#/components/schemas/ExternalMailConnectorID'
        connection_id:
          $ref: '#/components/schemas/PositiveID'
        backfill_days:
          type: integer
          minimum: 1
          maximum: 90
          description: How far back a new binding first reads; 14 when omitted.
    ExternalMailAuthorizationResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - authorization_url
            - expires_at
          properties:
            authorization_url:
              type: string
              format: uri
              description: The provider sign-in page to send the browser to. It carries a single-use
                `state` and an S256 PKCE challenge.
            expires_at:
              type: string
              format: date-time
              description: The sign-in must be completed before this time (10 minutes).
    CompleteExternalMailAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - state
        - code
      properties:
        state:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          maxLength: 4096
    BindExternalMailCredentialsRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - host
        - username
        - password
      properties:
        provider:
          $ref: '#/components/schemas/ExternalMailConnectorID'
        host:
          type: string
          description: The IMAP server, such as `imap.mail.me.com`.
          minLength: 1
          maxLength: 253
        port:
          type: integer
          description: Implicit-TLS IMAP; only 993 is accepted.
          minimum: 1
          maximum: 65535
          default: 993
        username:
          type: string
          description: The login. The bound account is derived from it, never named by the caller; the
            lowercased username when it contains `@`, otherwise `username@host`.
          minLength: 1
          maxLength: 320
        password:
          type: string
          format: password
          writeOnly: true
          description: An app password issued by the provider. Never returned.
          minLength: 1
          maxLength: 320
        backfill_days:
          type: integer
          description: How far back the first sync reads INBOX; 14 when omitted.
          minimum: 1
          maximum: 90
    ExternalMailConnectionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/ExternalMailConnection'
    ExternalMailConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - account_address
        - mailbox_id
        - status
        - last_synced_at
        - last_error_code
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        provider:
          $ref: '#/components/schemas/ExternalMailConnectorID'
        account_address:
          type: string
          maxLength: 320
        mailbox_id:
          description: The `external` mailbox synced mail is stored in.
          allOf:
            - $ref: '#/components/schemas/PositiveID'
        status:
          type: string
          description: '`active` connections are synced every two minutes; `needs_reconnect` lost the
            provider grant and waits for the owner to bind again; `revoked` was unbound and is never
            synced again.'
          enum:
            - active
            - needs_reconnect
            - revoked
        last_synced_at:
          description: When a sync last succeeded; null before the first.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        last_error_code:
          description: The latest failed sync, `external.auth_failed`, `external.fetch_failed` (retried
            with exponential backoff from two minutes up to an hour), or `external.provider_unavailable`
            (the instance no longer runs the connector); null after a success.
          oneOf:
            - type: string
              maxLength: 64
            - type: 'null'
        created_at:
          type: string
          format: date-time
    ExternalMailConnectionListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalMailConnection'
    ExternalMailSyncRun:
      type: object
      additionalProperties: false
      description: One fetch of a connection. It never carries message data.
      required:
        - id
        - started_at
        - finished_at
        - outcome
        - fetched_count
        - stored_count
        - more
        - error_code
        - timed_out
        - throttled
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        outcome:
          type: string
          description: '`ok` saved a page; `auth_failed` lost the grant; `fetch_failed` is any other
            provider failure and backs off; `cursor_expired` started over from an empty cursor;
            `provider_unavailable` means the instance no longer runs the connector; `dropped` means the
            connection was revoked or lost its grant while the fetch ran, so nothing was stored.'
          enum:
            - ok
            - auth_failed
            - fetch_failed
            - cursor_expired
            - provider_unavailable
            - dropped
        fetched_count:
          description: Messages the provider returned.
          type: integer
          minimum: 0
        stored_count:
          description: Messages that were new and stored.
          type: integer
          minimum: 0
        more:
          description: The provider had another page ready.
          type: boolean
        error_code:
          description: The connection error code of a failed fetch; null otherwise.
          oneOf:
            - type: string
              maxLength: 64
            - type: 'null'
        timed_out:
          description: The fetch hit its deadline (`EXTERNAL_MAIL_FETCH_TIMEOUT`); the outcome is `fetch_failed`.
          type: boolean
        throttled:
          description: The connection already fetched the most pages in a row allowed at once
            (`EXTERNAL_MAIL_MAX_IMMEDIATE_PAGES`), so its next page waits the spacing.
          type: boolean
    ExternalMailSyncRunListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExternalMailSyncRun'
    ExternalMailPurgeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - deleted_messages
            - completed
          properties:
            deleted_messages:
              description: Copies this request deleted.
              type: integer
              minimum: 0
            completed:
              description: True when no copy is left and the mailbox and connection are deleted.
              type: boolean
    MailTriageCategory:
      type: string
      description: '`reply` needs the reader''s answer, `deadline` carries a date, `fyi` is for
        information, `review` means the model could not decide.'
      enum:
        - reply
        - deadline
        - fyi
        - review
    MailTriage:
      type: object
      additionalProperties: false
      description: A message's triage result as every reader of the mailbox sees it.
      required:
        - category
        - reason
        - due_at
        - source
      properties:
        category:
          $ref: '#/components/schemas/MailTriageCategory'
        reason:
          type: string
          maxLength: 120
          description: One masked line explaining the category; empty for a manual decision.
        due_at:
          description: The deadline; only for `deadline`, and null when none was found.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        source:
          type: string
          enum:
            - ai
            - manual
    InboxTriageCounts:
      type: object
      additionalProperties: false
      required:
        - reply
        - deadline
        - fyi
        - review
      properties:
        reply:
          type: integer
          minimum: 0
        deadline:
          type: integer
          minimum: 0
        fyi:
          type: integer
          minimum: 0
        review:
          type: integer
          minimum: 0
    MailTriageSetting:
      type: object
      additionalProperties: false
      required:
        - available
        - enabled
        - daily_message_cap
        - draft_enabled
        - instance_daily_cap
        - updated_at
      properties:
        available:
          type: boolean
          description: False when the instance has no AI triage model; triage cannot be turned on.
        enabled:
          type: boolean
        daily_message_cap:
          type: integer
          minimum: 1
          maximum: 100000
          description: Messages classified per UTC day at most; later ones wait for the next day.
        draft_enabled:
          type: boolean
          description: Whether members with `send` may ask for reply drafts.
        instance_daily_cap:
          type: integer
          minimum: 0
          description: The instance ceiling; the effective cap is the lower of the two. 0 when unavailable.
        updated_at:
          description: Null until an owner or admin saves the switches.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    UpdateMailTriageSettingRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
        - daily_message_cap
        - draft_enabled
      properties:
        enabled:
          type: boolean
        daily_message_cap:
          type: integer
          minimum: 1
          maximum: 100000
        draft_enabled:
          type: boolean
    SetMailboxTriageSettingRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    UpdateMailTriageRequest:
      type: object
      additionalProperties: false
      required:
        - category
      properties:
        category:
          type: string
          enum:
            - reply
            - deadline
            - fyi
        due_at:
          description: Only with `deadline`.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    MailReplyDraftBasis:
