          description: The domain as it is now, with `setting_up` true while the setup runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The domain's managed zone is not active yet (`MAILBOX.ZONE_PENDING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
