        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/PlatformAccountID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountEventPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the account
            (`MAILBOX.PLATFORM_ACCOUNT_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/platform-account-handovers:
    post:
      operationId: handOverPlatformAccounts
      summary: Hand over every platform account of one owner
      description: Needs the `owner` or `admin` organization role. Moves every account owned by
        `from_user_id` to `to_user_id` in one transaction and records an `owner_changed` event for
        each. Independent of mailbox handover.
      tags:
