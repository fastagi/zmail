  /v1/inbound-mail-messages:
    post:
      operationId: receiveInboundMailMessage
      summary: Accept one raw message from the mail edge
      description: 'Called by the Cloudflare Email Worker, not by browsers. The body is the raw RFC 5322
        message. `X-Mailbox-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256>` computed with the
        shared inbound secret over `<t>.<lowercase recipient>.<body>`; a timestamp more than five
        minutes from server time is rejected. A repeated delivery of the same message to the same
        mailbox returns `200` with `duplicate: true`.'
      tags:
        - Mailboxes
      security: []
      parameters:
        - name: X-Mailbox-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Mailbox-Recipient
          in: header
          required: true
          description: The envelope recipient the edge accepted the message for.
          schema:
            type: string
            minLength: 3
            maxLength: 320
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          description: The message was already stored by an earlier delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '201':
          description: The message is stored in the recipient's mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '401':
          description: The signature is missing, stale, or wrong (`MAILBOX.INBOUND_SIGNATURE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No mailbox has the recipient address (`MAILBOX.RECIPIENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The raw message exceeds 5 MiB (`MAILBOX.INBOUND_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body is not a parseable message with a sender (`MAILBOX.INBOUND_UNPARSEABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Inbound mail has no shared secret configured (`MAILBOX.INBOUND_DISABLED`), or the
            database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/outbound-mail-messages:
    post:
      operationId: sendOutboundMailMessage
      summary: Send a message with an API key
      description: "For backend services. The key must hold the `mail:send` scope, and `from` must be the
        address of a mailbox of the organization named by `Organization-Id`, of which the key's owner must be a member. Outcomes are the same as sending from a mailbox: a
        message the provider does not accept answers `502 MAILBOX.DELIVERY_FAILED` and is kept with
        status `failed`."
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOutboundMailMessageRequest'
      responses:
        '200':
          description: The `Idempotency-Key` already named a sent message; it is returned and nothing is sent
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '201':
          description: The provider accepted the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '202':
          description: The organization reached the rolling 24-hour send limit; the message is stored as queued with `queued_reason` `send_limit` and is sent when the limit has room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization has no mailbox with the `from` address (`MAILBOX.NOT_FOUND`), or the key's owner is not a member of it (`ORGANIZATION.NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The `Idempotency-Key` was used with different content or matches a sealed message
            (`MAILBOX.IDEMPOTENCY_CONFLICT`, with no message data), or its first attempt has not finished
            (`MAILBOX.SEND_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, the message is unusable (`MAILBOX.MESSAGE_INVALID`), the
            `Idempotency-Key` is malformed (`MAILBOX.IDEMPOTENCY_KEY_INVALID`), or the template is
            transactional (`MAILBOX.TEMPLATE_KIND_MISMATCH`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The send limit is full and as many messages already wait as the limit allows (`MAILBOX.SEND_LIMIT_REACHED`); nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The mail provider did not accept the message (`MAILBOX.DELIVERY_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/outbound-mail-messages/{message_id}:
    get:
      operationId: getOutboundMailMessage
      summary: Get a message the organization sent
      description: The key must hold the `mail:read` scope. Only outbound messages are visible here.
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailMessageID'
      responses:
        '200':
          description: The message with its delivery status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/transactional-messages:
    post:
      operationId: sendTransactionalMessage
      summary: Send one transactional message from a transactional template
      description: "For backend services. The key must hold the `mail:transactional` scope (`*` also grants it);
        test keys are accepted. The template is named by its `key` and must be a transactional template of the
        organization named by `Organization-Id`, of which the key's owner must be a member. The message is
        stored as `queued` and dispatched after the request commits; a test key or a simulator address never
        calls the provider. Checks run in this order: key authentication, organization, scope, feature switch,
        body, `Idempotency-Key`, per-key rate limit, template and variables, idempotent replay, per-recipient
        rate limit, sender domain, suppression, transactional lane. See MAILBOXES.md, Transactional Mail."
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/TransactionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionalMessageRequest'
      responses:
        '200':
          description: The `Idempotency-Key` already named a message of this key's mode in the last 24 hours with
            the same content; that message is returned and nothing is sent again.
          headers:
            Location:
              description: The message's path, `/v1/transactional-messages/{message_id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageResponse'
        '202':
          description: The message is stored. It is `queued` (with `queued_reason` `send_limit` when the
            transactional lane is full) or, for a suppressed recipient, `suppressed`.
          headers:
            Location:
              description: The message's path, `/v1/transactional-messages/{message_id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key lacks `mail:transactional` (`PERMISSION.DENIED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The key's owner is not a member of the organization (`ORGANIZATION.NOT_FOUND`), or the
            organization has no template with this key (`MAILBOX.TEMPLATE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The `Idempotency-Key` named a message with different content in the last 24 hours
            (`MAILBOX.IDEMPOTENCY_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation (`COMMON.VALIDATION_FAILED`); the recipient is not one bare
            address, a variable is not declared by the template, or a simulator address has an unknown local
            part (`MAILBOX.MESSAGE_INVALID`); the `Idempotency-Key` is missing or not 1 to 255 printable ASCII
            characters (`MAILBOX.IDEMPOTENCY_KEY_INVALID`); the template is not transactional
            (`MAILBOX.TEMPLATE_KIND_MISMATCH`); a required variable is missing or empty
            (`MAILBOX.TEMPLATE_VARIABLES_MISSING`, one field error per variable); or the template's sender
            domain is not verified (`MAILBOX.DOMAIN_NOT_VERIFIED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The key sent more than its per-second limit (`COMMON.RATE_LIMITED`), the same template
            went to the same recipient too often in this mode (`MAILBOX.RECIPIENT_RATE_LIMITED`), or the
            transactional lane is full and as many messages already wait as the lane allows
            (`MAILBOX.SEND_LIMIT_REACHED`, nothing is stored). The rate limits set `Retry-After`.
          headers:
            Retry-After:
              description: Seconds until the limit has room; at least 1. Set for the two rate limits.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The instance has not enabled transactional mail (`MAILBOX.TRANSACTIONAL_DISABLED`), or
            the database or a dependency is unavailable (`COMMON.SERVICE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/transactional-messages/{message_id}:
    get:
      operationId: getTransactionalMessage
      summary: Get one transactional message with its events
      description: The key must hold the `mail:transactional` scope; test keys are accepted. A live key reads only
        live messages and a test key only test messages; a message of the other mode, or of another
        organization, is `404 MAILBOX.TRANSACTIONAL_MESSAGE_NOT_FOUND`.
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/TransactionalMessageID'
      responses:
        '200':
          description: The message with up to 50 events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key lacks `mail:transactional` (`PERMISSION.DENIED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The key's owner is not a member of the organization (`ORGANIZATION.NOT_FOUND`), or no
            message of this organization and mode has the id (`MAILBOX.TRANSACTIONAL_MESSAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/transactional-mail-log:
    get:
      operationId: listTransactionalMailLog
      summary: List the organization's transactional messages, newest first
      description: For the console; any member may read it. Entries carry the masked recipient and masked subject,
        never the full recipient or the variables. Keyset pages; pass `meta.next_cursor` as `cursor` for the
        next, older page. Without `since` and `until` the last 7 days are listed; the range is at most 30 days.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: mode
          in: query
          description: Which mode to list. Defaults to `live`.
          schema:
            $ref: '#/components/schemas/TransactionalMode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionalMessageStatus'
        - name: last_event
          in: query
          schema:
            type: string
            enum:
              - delivered
              - deferred
              - bounced
              - failed
              - rejected
              - complained
        - name: outcome
          in: query
          description: '`delivered` keeps `last_event` `delivered`; `problem` keeps `last_event` `bounced`,
            `complained`, `failed`, or `rejected`, or `status` `failed` or `suppressed`. Combined with `status`
            and `last_event` as an intersection.'
          schema:
            type: string
            enum:
              - delivered
              - problem
        - name: template
          in: query
          description: A template key.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,63}$'
            maxLength: 64
        - name: to
          in: query
          description: An exact recipient address, compared in lowercase after trimming.
          schema:
            type: string
            maxLength: 320
        - name: since
          in: query
          description: Inclusive lower bound on `created_at`.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Exclusive upper bound on `created_at`.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque keyset position from `meta.next_cursor`; absent or empty requests the newest page.
          schema:
            type: string
            maxLength: 128
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalLogPageResponse'
        '400':
          description: A filter is unusable, the range is longer than 30 days, or the cursor is malformed
            (`COMMON.INVALID_INPUT`); or the organization header is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/transactional-mail-log/{message_id}:
    get:
      operationId: getTransactionalMailLogEntry
      summary: Get one transactional message of the log with its timeline
      description: For the console; any member may read it, in either mode. Adds the sender, the masked variables,
        and up to 50 events to the log entry. The full recipient is never returned.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/TransactionalMessageID'
      responses:
        '200':
          description: The log entry with its sender, masked variables, and events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalLogEntryResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The caller is not a member of the organization (`ORGANIZATION.NOT_FOUND`), or the
            organization has no transactional message with the id (`MAILBOX.TRANSACTIONAL_MESSAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/transactional-test-sends:
    post:
      operationId: sendTransactionalTest
      summary: Send a transactional template to the caller's own account address
      description: For the console; any member may. The recipient is always the caller's account email and cannot
        be named. Variables not given take the template's sample values. `live` counts in the transactional
        lane and calls the provider; `test` is simulated as `delivered`. At most 5 per minute per user. Otherwise
        the message follows `POST /v1/transactional-messages` from the per-recipient rate limit on, with a
        server-generated idempotency key.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionalTestSendRequest'
      responses:
        '202':
          description: The test message is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The caller is not a member of the organization (`ORGANIZATION.NOT_FOUND`), or the
            organization has no template with this key (`MAILBOX.TEMPLATE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation (`COMMON.VALIDATION_FAILED`); a variable is not declared by the
            template (`MAILBOX.MESSAGE_INVALID`); the template is not transactional
            (`MAILBOX.TEMPLATE_KIND_MISMATCH`); a required variable has no value and no sample value
            (`MAILBOX.TEMPLATE_VARIABLES_MISSING`); or the template's sender domain is not verified
            (`MAILBOX.DOMAIN_NOT_VERIFIED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The caller sent more than 5 test messages in a minute (`COMMON.RATE_LIMITED`), the same
            template went to the caller's address too often in this mode (`MAILBOX.RECIPIENT_RATE_LIMITED`), or
            the transactional lane is full and as many messages already wait as it allows
            (`MAILBOX.SEND_LIMIT_REACHED`). The rate limits set `Retry-After`.
          headers:
            Retry-After:
              description: Seconds until the limit has room; at least 1. Set for the two rate limits.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The instance has not enabled transactional mail (`MAILBOX.TRANSACTIONAL_DISABLED`), or
            the database or a dependency is unavailable (`COMMON.SERVICE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/mail-send-lanes:
    get:
      operationId: listMailSendLanes
      summary: Show the organization's usage of each send lane
      description: Needs the `owner` or `admin` organization role. Computed on every request over the rolling
        24 hours before `computed_at`, never cached. Always three lanes, in the order `transactional`,
        `broadcast`, `personal`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: The usage of each lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailSendLaneUsageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-suppressions:
    get:
      operationId: listMailSuppressions
      summary: List the organization's suppressed addresses, newest first
      description: Needs the `owner` or `admin` organization role. Neither transactional messages nor broadcasts
        reach a listed address. Keyset pages ordered by `created_at` and `id`, newest first; pass
        `meta.next_cursor` as `cursor` for the next, older page.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: email
          in: query
          description: An exact address, compared in lowercase after trimming.
          schema:
            type: string
            maxLength: 320
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/MailSuppressionReason'
        - name: cursor
          in: query
          description: Opaque keyset position from `meta.next_cursor`; absent or empty requests the newest page.
          schema:
            type: string
            maxLength: 128
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the suppression list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailSuppressionPageResponse'
        '400':
          description: A filter is unusable or the cursor is malformed (`COMMON.INVALID_INPUT`); or the
            organization header is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-suppressions/{suppression_id}:
    delete:
      operationId: deleteMailSuppression
      summary: Remove an address from the suppression list
      description: Needs the `owner` or `admin` organization role. Transactional messages may reach the address
        again; a contact's status is not changed. Idempotent, and discloses nothing; an id the organization does
        not have also answers `204`. A removal is audited as `mail_suppression.removed`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailSuppressionID'
      responses:
        '204':
          description: The address is not on the suppression list.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-messages:
    get:
      operationId: listMailLog
      summary: List messages across every mailbox of the organization, newest first
      description: The log carries summaries without bodies; read a message through its mailbox.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MailDirection'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MailStatus'
        - name: mailbox_id
          in: query
          required: false
          description: Keep only one mailbox. Another organization's mailbox matches nothing.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: q
          in: query
          required: false
          description: Case-insensitive match on the subject, the sender address, or a recipient address.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailLogPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-message-stats:
    get:
      operationId: listMailMessageStats
      summary: Count the organization's mail per UTC day
      description: Returns one entry for every day of the window, oldest first, including days without mail.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: days
          in: query
          required: false
          description: Window length ending today (UTC). Defaults to 7.
          schema:
            type: integer
            minimum: 1
            maximum: 90
      responses:
        '200':
          description: Per-day counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDayStatsListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/inbox-messages:
    get:
      operationId: listInboxMessages
      summary: List the caller's mail across every mailbox they may read, newest first
      description: The unified inbox. Only mailboxes the caller has `view` on are read; a mailbox, a
        mail role, or an id the caller cannot read, or one of another organization, matches nothing
        instead of answering `403` or `404`. Sealed messages and the trash never appear. Each parameter
        may appear at most once; a repeated parameter, `page`, an unknown value, a malformed cursor, an
        unknown `tz`, or a combination outside the mailbox contract's rules is `400 COMMON.INVALID_INPUT`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: view
          in: query
          required: false
          description: '`all` is inbound mail in `default` (every Inbox). `today` is inbound mail outside the
            trash that arrived since the start of today in `tz`. `pending` is mail of both directions the
            caller starred, outside `archive` and the trash. `sent` is outbound mail in `default` (every
            Sent). Defaults to `all`.'
          schema:
            $ref: '#/components/schemas/InboxView'
        - name: role_id
          in: query
          required: false
          description: Keep only the mailboxes of one mail role, or `none` for the mailboxes without a role.
            A role the caller cannot see matches nothing.
          schema:
            oneOf:
              - $ref: '#/components/schemas/PositiveID'
              - type: string
                enum:
                  - none
        - name: mailbox_id
          in: query
          required: false
          description: Keep only one mailbox. A mailbox the caller may not read, or another organization's,
            matches nothing.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: unread
          in: query
          required: false
          description: '`true` keeps only inbound messages the caller has not read; outbound messages are
            always read and never match. `false` keeps the others. Read state is the caller''s own.'
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Search, only with `view=all`. At most 200 characters as sent; the value is then
            trimmed, and one that is empty after trimming or contains a control character is
            `400 COMMON.INVALID_INPUT`. Matches like the single-mailbox search and searches every placement
            except the trash, both directions. A search the database cannot finish within 2 seconds is
            `422 MAILBOX.SEARCH_TOO_BROAD`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: group
          in: query
          required: false
          description: '`thread` lists one item per thread and mailbox. Only with `view` `all` or `sent`,
            and without `unread` and `q`.'
          schema:
            type: string
            enum:
              - thread
        - name: triage
          in: query
          required: false
          description: 'Keep only messages whose triage result is one of these comma-separated, distinct
            categories, for example `reply,review`. Only with `view` `all` or `today`, and without `group`
            and `q`. While the organization''s AI triage is off it matches nothing.'
          schema:
            type: string
            pattern: '^(reply|deadline|fyi|review)(,(reply|deadline|fyi|review)){0,3}$'
            maxLength: 32
        - name: tz
          in: query
          required: false
          description: The IANA time zone that defines today for `view=today`, at most 64 characters.
            Defaults to `UTC`. `Local` and an empty value are `400 COMMON.INVALID_INPUT`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            default: UTC
        - $ref: '#/components/parameters/InboxCursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of message summaries without bodies, ordered by `created_at`, newest first,
            then by id, highest first. With `group=thread`, one page of threads, each as its latest message
            in the view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCursorPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The search could not finish within 2 seconds; a longer `q` is needed
            (`MAILBOX.SEARCH_TOO_BROAD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/inbox-message-counts:
    get:
      operationId: getInboxMessageCounts
      summary: Count the caller's unified inbox views, mail roles, and mailboxes
      description: Live counts of the caller's own read and star state over the mailboxes they have
        `view` on. Sealed messages and the trash are never counted. Only `tz` is accepted; any other or
        repeated parameter is `400 COMMON.INVALID_INPUT`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: tz
          in: query
          required: false
          description: The IANA time zone that defines today, at most 64 characters. Defaults to `UTC`.
            `Local` and an empty value are `400 COMMON.INVALID_INPUT`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            default: UTC
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCountsResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-roles:
    get:
      operationId: listMailRoles
      summary: List the organization's mail roles
      description: Owners and admins see every mail role with every mailbox in it. Members see only the
        roles holding at least one mailbox they can see, with only those mailboxes. A mail role groups
        mailboxes for navigation and grants nothing.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: At most 50 mail roles by name ignoring case, then by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRoleListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createMailRole
      summary: Create a mail role
      description: Needs the `owner` or `admin` organization role. The body is at most 4 KiB; a larger or
        malformed body is `400 COMMON.INVALID_INPUT`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRoleInput'
      responses:
        '201':
          description: The created mail role, with no mailboxes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRoleResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another mail role of the organization has the name, ignoring case
            (`MAILBOX.ROLE_NAME_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A field failed validation (`COMMON.VALIDATION_FAILED` with `errors` keyed `name`,
            `color`, `description`, or `owner_user_id`), or the organization has 50 mail roles
            (`MAILBOX.ROLE_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-roles/{role_id}:
    put:
      operationId: updateMailRole
      summary: Replace a mail role
      description: Needs the `owner` or `admin` organization role. Replaces every field; an omitted field
        takes its default. The last write wins.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailRoleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRoleInput'
      responses:
        '200':
          description: The mail role after the change, with the mailboxes the caller can see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRoleResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the mail role (`MAILBOX.ROLE_NOT_FOUND`)
            is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another mail role of the organization has the name, ignoring case
            (`MAILBOX.ROLE_NAME_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMailRole
      summary: Delete a mail role
      description: Needs the `owner` or `admin` organization role. Its mailboxes become ungrouped in the
        same statement; no mailbox access changes.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailRoleID'
      responses:
        '204':
          description: The mail role is deleted and its mailboxes have no role.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the mail role (`MAILBOX.ROLE_NOT_FOUND`)
            is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/platform-accounts:
    get:
      operationId: listPlatformAccounts
      summary: List the platform account ledger
      description: Owners and admins see every account. Members see only the accounts registered with a
        mailbox they may read or that they own; `q` matches a registration address only through a
        mailbox they can see, and `mailbox_address` is null for a mailbox they cannot see. Ordered by
        platform, then handle, both ignoring case, then id. A malformed filter is
        `400 COMMON.INVALID_INPUT`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: q
          in: query
          required: false
          description: Matches the platform, the handle, or the registration address anywhere, ignoring
            case; wildcards match themselves. Trimmed; at most 100 characters.
          schema:
            type: string
            maxLength: 400
        - name: role_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: mailbox_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: owner_user_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlatformAccountStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated ledger entries the caller may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createPlatformAccount
      summary: Add a platform account to the ledger
      description: Needs the `owner` or `admin` organization role. Records a `created` event. The body is at
        most 8 KiB; a larger or malformed body is `400 COMMON.INVALID_INPUT`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAccountInput'
      responses:
        '201':
          description: The created ledger entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The organization already has an account with this platform and handle, ignoring case
            (`MAILBOX.PLATFORM_ACCOUNT_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/platform-accounts/{account_id}:
    put:
      operationId: updatePlatformAccount
      summary: Replace a platform account
      description: Needs the `owner` or `admin` organization role. Replaces every field; an omitted field
        takes its default. Each change of status, owner, or registration mailbox records an event. The
        last write wins.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/PlatformAccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAccountInput'
      responses:
        '200':
          description: The ledger entry after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the account
            (`MAILBOX.PLATFORM_ACCOUNT_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another account of the organization has this platform and handle, ignoring case
            (`MAILBOX.PLATFORM_ACCOUNT_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deletePlatformAccount
      summary: Delete a platform account
      description: Needs the `owner` or `admin` organization role. Records a `deleted` event, which is kept,
        and removes the entry.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/PlatformAccountID'
      responses:
        '204':
          description: The entry is deleted.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the account
            (`MAILBOX.PLATFORM_ACCOUNT_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/platform-accounts/{account_id}/events:
    get:
      operationId: listPlatformAccountEvents
      summary: List a platform account's handover and status history, newest first
      description: Follows the listing's visibility; an account the caller may not see is
