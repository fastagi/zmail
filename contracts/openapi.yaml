        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailContactImport'
    MailDomainRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: The domain, such as `example.com` or `mail.example.com`. Case and a trailing dot are ignored.
          minLength: 1
          maxLength: 253
    MailDomainRecord:
      type: object
      additionalProperties: false
      required:
        - purpose
        - type
        - name
        - content
        - status
      properties:
        purpose:
          type: string
          enum:
            - receiving
            - sending
            - dmarc
        type:
          type: string
          description: DNS record type, such as `MX`, `TXT`, or `CNAME`.
          maxLength: 10
        name:
          type: string
          description: Fully qualified record name.
          maxLength: 255
        content:
          type: string
          description: The value the record needs. For DMARC, the existing record when one is present. Empty
            for a sending record while Email Sending is not enabled yet.
        priority:
          type: integer
          minimum: 0
          maximum: 65535
        status:
          type: string
          description: '`conflict` means another record of the same kind holds the name; Zmail never replaces it.'
          enum:
            - ok
            - missing
            - conflict
        found:
          type: string
          description: The conflicting value, when `status` is `conflict`.
    MailDomain:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - zone_name
        - status
        - records
        - setting_up
        - checked_at
        - verified_at
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          maxLength: 253
        zone_name:
          type: string
          description: The Cloudflare zone that contains the domain.
          maxLength: 253
        status:
          type: string
          description: '`verified` when the last check found every record; mailboxes can be created only then.'
          enum:
            - pending
            - verified
        records:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MailDomainRecord'
        setting_up:
          type: boolean
          description: A setup is running in the background. The domain changes when it finishes; read it again
            until this is false.
        last_error:
          type: string
          description: The provider's explanation of the last failed setup step, while the domain is pending.
          maxLength: 500
        checked_at:
          type:
            - string
            - 'null'
          format: date-time
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the domain first verified.
        created_at:
          type: string
          format: date-time
    MailDomainResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailDomain'
    MailDomainListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MailDomain'
    MailContactList:
      type: object
      additionalProperties: false
