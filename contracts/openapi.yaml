      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAccountHandoverRequest'
      responses:
        '201':
          description: The accounts moved; possibly none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountHandoverResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-connectors:
    get:
      operationId: listExternalMailConnectors
      summary: List the connectors outside accounts can be bound with
      description: Lists the instance's connectors in a stable order, so a client offers one button per
        provider without knowing them in advance. Empty while external mail is off. Never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: The connectors; empty when none is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectorListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-authorizations:
    post:
      operationId: startExternalMailAuthorization
      summary: Start binding or reconnecting an outside account
      description: Stores a pending sign-in for the caller, single use and valid for 10 minutes, and
        answers the provider page to send the browser to. With `connection_id` it reconnects that
        connection, which must be the caller's own. Session only; never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExternalMailAuthorizationRequest'
      responses:
        '201':
          description: The sign-in is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailAuthorizationResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization is not found (`ORGANIZATION.NOT_FOUND`), the instance does not run
            the connector or external mail is off (`MAILBOX.EXTERNAL_PROVIDER_UNAVAILABLE`), or the
            connection is not the caller's (`MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Neither `provider` nor `connection_id`, a `provider` other than the connection's
            (`MAILBOX.EXTERNAL_AUTHORIZATION_INVALID`), or a malformed body (`VALIDATION.FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-authorizations/completions:
    post:
      operationId: completeExternalMailAuthorization
      summary: Finish binding or reconnecting an outside account
      description: Takes the `state` and `code` the provider returned to the callback page. The pending
        sign-in is used up whether or not the exchange succeeds. A new account creates a private,
        read-only `external` mailbox and its connection (`201`); the caller's own account in any state
        is restored with the same mailbox, so synced mail is never copied twice (`200`). Session only;
        never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExternalMailAuthorizationRequest'
      responses:
        '200':
          description: An existing connection of the caller was restored and is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectionResponse'
        '201':
          description: A new external mailbox and connection were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectionResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The sign-in is unknown, expired, used, or another member's
            (`MAILBOX.EXTERNAL_AUTHORIZATION_NOT_FOUND`), or the connector is no longer enabled
            (`MAILBOX.EXTERNAL_PROVIDER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A reconnect signed in to another account (`MAILBOX.EXTERNAL_ACCOUNT_MISMATCH`),
            another member bound the account (`MAILBOX.EXTERNAL_ACCOUNT_TAKEN`), or the caller bound the
            most accounts allowed, 10 (`MAILBOX.EXTERNAL_CONNECTION_LIMIT`). The grant is handed back to
            the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The provider refused the code (`MAILBOX.EXTERNAL_AUTHORIZATION_FAILED`), or a
            malformed body (`VALIDATION.FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-credentials:
    post:
      operationId: bindExternalMailCredentials
      summary: Bind or reconnect an outside account with an app password
      description: For connectors whose `auth_kind` is `password` (the generic `imap` connector for iCloud,
        Yahoo, Fastmail, QQ, 163, or a self-hosted server). The server signs in to `host` over implicit
        TLS on port 993 with a verified certificate and opens INBOX once before anything is stored;
        hosts that resolve to loopback, private, link-local, or unspecified addresses are refused. The
        outcomes follow `completeExternalMailAuthorization`. A new account creates a private, read-only
        `external` mailbox and its connection (`201`); the caller's own account in any state is restored
        with the new password and the same mailbox (`200`), and a restore that names another host
        starts the backfill over. The account is derived from the login, never named by the caller. The
        password is sealed at rest, never logged, never returned, and never written to audit metadata.
        Attempts are limited to 10 per member per 15 minutes and 30 per organization per hour. Session
        only; never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindExternalMailCredentialsRequest'
      responses:
        '200':
          description: An existing connection of the caller was restored and is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectionResponse'
        '201':
          description: A new external mailbox and connection were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectionResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization is not found (`ORGANIZATION.NOT_FOUND`), or the instance does not
            run the connector, the connector does not bind with a password, or external mail is off
            (`MAILBOX.EXTERNAL_PROVIDER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another member bound the account (`MAILBOX.EXTERNAL_ACCOUNT_TAKEN`), or the caller
            bound the most accounts allowed, 10 (`MAILBOX.EXTERNAL_CONNECTION_LIMIT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: The server refused the username or password (`MAILBOX.EXTERNAL_AUTHORIZATION_FAILED`);
            the server could not be reached over TLS, its certificate did not verify, or the host is not
            allowed, or refused the login for a transient reason (`MAILBOX.EXTERNAL_SERVER_UNREACHABLE`); a
            value carries a control character or the backfill is out of range
            (`MAILBOX.EXTERNAL_AUTHORIZATION_INVALID`); or a malformed body (`COMMON.VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-connections:
    get:
      operationId: listExternalMailConnections
      summary: List the caller's bound external mailboxes
      description: Lists the outside accounts (Gmail, Outlook, or any other connector) the caller bound in
        this organization, at most 10. While the instance enables no external mail source (`EXTERNAL_MAIL_PROVIDERS` empty)
        the route answers `404 MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`. The response is never cached
        and never carries a token.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: The caller's connections, id ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailConnectionListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization is not found (`ORGANIZATION.NOT_FOUND`), or external mail is off
            (`MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-connections/{connection_id}:
    delete:
      operationId: revokeExternalMailConnection
      summary: Unbind an external mailbox
      description: The member who bound the account, or an `owner` or `admin`, may unbind it. The grant is
        revoked at the provider on a best-effort basis, the stored token is erased, and the connection is
        never synced again; mail already synced stays in the external mailbox until the retention
        (`EXTERNAL_MAIL_REVOKED_RETENTION`, 30 days by default) ends, when the worker deletes it with the
        mailbox, unless the account is bound again before. Unbinding a revoked
        connection succeeds again. Another member's connection, another organization's id, and any id
        while external mail is off answer `404 MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/ExternalMailConnectionID'
      responses:
        '204':
          description: The connection is revoked.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the connection
            (`MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-connections/{connection_id}/sync-runs:
    get:
      operationId: listExternalMailSyncRuns
      summary: List a connection's latest sync runs
      description: Lists the latest fetches of the caller's own connection, newest first, at most 50.
        Each fetch records one run with its times, outcome, counts, and error code, never message data;
        the worker keeps a connection's latest 50 runs and none older than 14 days. Another member's
        connection, an `owner` or `admin` included, another organization's id, and any id while external
        mail is off answer `404 MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`. The response is never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/ExternalMailConnectionID'
      responses:
        '200':
          description: The connection's latest runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailSyncRunListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the caller's connection
            (`MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/external-mail-connections/{connection_id}/purges:
    post:
      operationId: purgeExternalMailCopies
      summary: Delete a revoked connection's copies at once
      description: Deletes for good the synced copies of the caller's own revoked connection instead of
        waiting for the retention (`EXTERNAL_MAIL_REVOKED_RETENTION`, 30 days by default) to end, then
        deletes the external mailbox and the connection with its sync runs, storing a `copies_purged`
        audit event with reason `owner` on the deleted mailbox. When more copies are left than one request
        deletes, the rest is due at once and the worker deletes it in its next passes. Only the member
        who bound the account may purge; anyone else, an `owner` or `admin` included, gets `404`. The
        route works while `EXTERNAL_MAIL_PROVIDERS` is empty, so switching the feature off never strands
        copies.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/ExternalMailConnectionID'
      responses:
        '200':
          description: Every copy, the mailbox, and the connection are deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailPurgeResponse'
        '202':
          description: Some copies are deleted; the worker deletes the rest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMailPurgeResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization (`ORGANIZATION.NOT_FOUND`) or the caller's connection
            (`MAILBOX.EXTERNAL_CONNECTION_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The connection is still bound; revoke it first (`MAILBOX.EXTERNAL_CONNECTION_NOT_REVOKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-triage-setting:
    get:
      operationId: getMailTriageSetting
      summary: Read the organization's AI triage switches
      description: Any member may read them; clients hide triage when `available` or `enabled` is false.
        The response is never cached.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: The switches; defaults until an owner or admin saves them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailTriageSettingResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateMailTriageSetting
      summary: Replace the organization's AI triage switches
      description: Organization owners and admins only. Every field is required. Turning triage on needs
        an instance model (`409 MAILBOX.TRIAGE_UNAVAILABLE` otherwise); turning it off always succeeds.
        The effective daily cap is the lower of `daily_message_cap` and the instance cap.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMailTriageSettingRequest'
      responses:
        '200':
          description: The switches after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailTriageSettingResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: AI triage is off for the organization, or the instance has no model
            (`MAILBOX.TRIAGE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-delivery-events:
    post:
      operationId: receiveMailDeliveryEvent
      summary: Accept one provider delivery event from the mail edge
      description: "Called by the Cloudflare Email Worker's queue consumer, not by browsers. The body is
        one Cloudflare Email Sending event (`cf.email.sending.message.*`, schema version 1),
        unchanged. `X-Mailbox-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256>` computed with the
        shared inbound secret over `<t>.delivery-event.<body>`. A repeated event returns `200` with
        `duplicate: true`."
      tags:
        - Mailboxes
      security: []
      parameters:
        - name: X-Mailbox-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Cloudflare Email Sending event. Only identifiers, the recipient, status codes, and
                classifications are read.
      responses:
        '200':
          description: The event was already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDeliveryEventResponse'
        '201':
          description: The event is recorded and the message summary is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDeliveryEventResponse'
        '401':
          description: The signature is missing, stale, or wrong (`MAILBOX.INBOUND_SIGNATURE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No outbound message has the event's message id (`MAILBOX.MESSAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: The body is not a usable Email Sending event (`MAILBOX.DELIVERY_EVENT_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No shared secret is configured (`MAILBOX.INBOUND_DISABLED`), or the database is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque server-side session credential returned by the FastBuild login API.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-fastbuild_operator
      description: HttpOnly platform-operator session cookie issued by POST /v1/operator/session. The
        name is `fastbuild_operator` outside production or `OPERATOR_SESSION_COOKIE_NAME` when configured.
        Unsafe methods also require an allowed `Origin` and the `X-CSRF-Token` header; see OPERATORS.md.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: A user-owned API key from POST /v1/api-keys. Each operation names the scopes the
        key must hold; see API_KEYS.md.
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    AuditCursor:
      name: cursor
      in: query
      description: Opaque keyset position from `meta.next_cursor`; absent or empty requests the newest
        page. The removed `page` parameter is rejected with 400.
      schema:
        type: string
        maxLength: 128
    PerPage:
      name: per_page
      in: query
      description: Requested page size, capped by the API.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    APIKeyID:
      name: api_key_id
      in: path
      required: true
      description: Positive API key identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationContext:
      name: Organization-Id
      in: header
      required: true
      description: Active organization for organization-scoped routes; verified against membership.
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,15}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag of the version the caller read; required for optimistic concurrency.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by the operator session endpoints.
      schema:
        type: string
        minLength: 1
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization identifier; resolved only through the caller's membership.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationMemberID:
      name: member_id
      in: path
      required: true
      description: Organization membership identifier, not the user's global ID.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Organization invitation identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    PermissionAccessRoleID:
      name: access_role_id
      in: path
      required: true
      description: Access role identifier within the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationID:
      name: notification_id
      in: path
      required: true
      description: Positive notification identifier owned by the caller.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationStatusFilter:
      name: status
      in: query
      description: Read-state filter.
      schema:
        type: string
        enum:
          - all
          - unread
        default: all
    AssetID:
      name: asset_id
      in: path
      required: true
      description: Lowercase canonical asset UUID owned by the caller.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    AssetStatusFilter:
      name: status
      in: query
      description: Lifecycle filter; deleted assets are never listed.
      schema:
        type: string
        enum:
          - all
          - pending
          - ready
          - rejected
        default: all
    AssetTransferToken:
      name: transfer_token
      in: path
      required: true
      description: Opaque, short-lived signed transfer token issued in a local-driver grant URL.
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned setting key for the route's scope, such as `localization.locale`.
      schema:
        type: string
        minLength: 1
    SettingIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Aggregate `"settings-<sha256>"` validator from a previous response; `*` and weak forms
        also match.
      schema:
        type: string
    WebhookEndpointID:
      name: webhook_endpoint_id
      in: path
      required: true
      description: Positive webhook endpoint identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryID:
      name: webhook_delivery_id
      in: path
      required: true
      description: Positive webhook delivery identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryEndpointFilter:
      name: endpoint_id
      in: query
      description: Only deliveries for this endpoint (canonical positive decimal).
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryStatusFilter:
      name: status
      in: query
      description: Only deliveries in this state.
      schema:
        $ref: '#/components/schemas/WebhookDeliveryStatus'
    WebhookTestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one canonical key; a retry with the same key returns the originally queued
        delivery.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$
    OperatorOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly equal one of `OPERATOR_ALLOWED_ORIGINS`; otherwise 403 OPERATOR.ORIGIN_REJECTED.
      schema:
        type: string
        minLength: 1
    OperatorUserID:
      name: user_id
      in: path
      required: true
      description: Positive user identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorMailDate:
      name: date
      in: query
      description: UTC calendar day `YYYY-MM-DD`; defaults to today (UTC) and must not be in the future.
      schema:
        type: string
        format: date
    OperatorMailPerPage:
      name: per_page
      in: query
      description: Requested page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OperatorOrganizationID:
      name: organization_id
      in: path
      required: true
      description: Positive organization identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorWebhookDeliveryID:
      name: delivery_id
      in: path
      required: true
      description: Canonical positive decimal delivery identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorSettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned app-scope setting key, such as `branding.display_name`.
      schema:
        type: string
        minLength: 1
    MailboxID:
      name: mailbox_id
      in: path
      required: true
      description: Positive mailbox identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailboxMemberUserID:
      name: user_id
      in: path
      required: true
      description: Positive user identifier of the mailbox member.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailBroadcastID:
      name: broadcast_id
      in: path
      required: true
      description: Positive mail broadcast identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailContactID:
      name: contact_id
      in: path
      required: true
      description: Positive mail contact identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailContactListID:
      name: list_id
      in: path
      required: true
      description: Positive mail contact list identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailDomainID:
      name: domain_id
      in: path
      required: true
      description: Positive connected mail domain identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailZoneID:
      name: zone_id
      in: path
      required: true
      description: Positive managed mail zone identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailDNSRecordID:
      name: record_id
      in: path
      required: true
      description: Cloudflare's identifier of a DNS record.
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{1,64}$
    MailTemplateID:
      name: template_id
      in: path
      required: true
      description: Positive mail template identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailMessageID:
      name: message_id
      in: path
      required: true
      description: Positive mail message identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailAttachmentID:
      name: attachment_id
      in: path
      required: true
      description: Positive mail attachment identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailThreadID:
      name: thread_id
      in: path
      required: true
      description: Positive mail thread identifier, the `thread_id` of its messages.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailFolderID:
      name: folder_id
      in: path
      required: true
      description: Positive mail folder identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailLabelID:
      name: label_id
      in: path
      required: true
      description: Positive mail label identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    InboxCursor:
      name: cursor
      in: query
      description: Opaque position from `meta.next_cursor`, passed back unchanged; absent requests the
        newest page. A malformed cursor is `400 COMMON.INVALID_INPUT`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MailRoleID:
      name: role_id
      in: path
      required: true
      description: Positive mail role identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    ExternalMailConnectionID:
      name: connection_id
      in: path
      required: true
      description: Positive external mail connection identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    PlatformAccountID:
      name: account_id
      in: path
      required: true
      description: Positive platform account identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Names this send within its mailbox. A repeat with the same key and the same content
        returns the first attempt's outcome and does not call the provider again.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    TransactionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Names this message within the organization and the key's mode for 24 hours from the first
        message. A repeat with the same content returns that message; different content is
        `409 MAILBOX.IDEMPOTENCY_CONFLICT`. After 24 hours the key is released and names a new message.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    TransactionalMessageID:
      name: message_id
      in: path
      required: true
      description: Positive transactional message identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailSuppressionID:
      name: suppression_id
      in: path
      required: true
      description: Positive suppression list entry identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
  responses:
    Forbidden:
      description: The caller is authenticated but not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The `If-Match` version is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: The operation requires an `If-Match` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests; `Retry-After` is set when the reset time is known.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The resource existed but has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInput:
      description: The request body or semantic input is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    APIKeyNotFound:
      description: The API key is missing or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServiceUnavailable:
      description: Required persistence or another dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationInvalidCredentials:
      description: Unknown identifier, wrong password, or inactive account (`AUTH.INVALID_CREDENTIALS`);
        the cases are deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationAccountDisabled:
      description: The session belongs to a disabled account (`AUTH.ACCOUNT_DISABLED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrganizationContextInvalid:
      description: '`ORGANIZATION.CONTEXT_REQUIRED` when `Organization-Id` is absent, `ORGANIZATION.CONTEXT_INVALID`
        when it is malformed or repeated, or `COMMON.INVALID_INPUT` for malformed JSON or path IDs.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionAccessRoleValidationFailed:
      description: Field validation failed (`COMMON.VALIDATION_FAILED` with `errors`), or a requested
        permission key is not in the code-owned catalog (`PERMISSION.UNKNOWN`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    AssetConflict:
      description: '`ASSET.NOT_READY` when the lifecycle state forbids the operation, or `ASSET.IDEMPOTENCY_CONFLICT`
        when an idempotency key is reused with different metadata.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUploadExpired:
      description: '`ASSET.UPLOAD_EXPIRED`: the pending upload lifetime elapsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTooLarge:
      description: '`ASSET.SIZE_EXCEEDED` when declared, transferred, or stored size violates the asset
        policy, or `COMMON.REQUEST_TOO_LARGE` when the global body limit rejects the request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUnprocessable:
      description: '`ASSET.INVALID_MEDIA_TYPE`: an unsupported or inconsistent name, media type, or content.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or belongs to another scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: the value is null, not a supported scalar, violates the definition,
        or the body has unknown fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidRequest:
      description: '`COMMON.INVALID_INPUT`: malformed, weak, wildcard, or multiple `If-Match` validators,
        or malformed/trailing JSON.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UsageForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may read organization usage.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may manage webhooks.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointNotFound:
      description: '`WEBHOOK.ENDPOINT_NOT_FOUND` for an endpoint outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointVersionConflict:
      description: '`WEBHOOK.ENDPOINT_VERSION_CONFLICT`: the `If-Match` version is stale.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookUnprocessable:
      description: '`WEBHOOK.INVALID_EVENT_TYPE` or `WEBHOOK.INVALID_TARGET`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookTestConflict:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED` when the endpoint is disabled or not subscribed to `webhook.test`,
        or `WEBHOOK.IDEMPOTENCY_CONFLICT`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetNotFound:
      description: '`ASSET.NOT_FOUND` for an absent, deleted, or foreign asset; a non-UUID path also returns
        404.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTransferNotFound:
      description: '`ASSET.NOT_FOUND`: the token is invalid, expired, for another operation, the asset
        is gone, or the local driver is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookDeliveryNotFound:
      description: '`WEBHOOK.DELIVERY_NOT_FOUND` for a delivery outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorForbidden:
      description: '`AUTH.ACCOUNT_DISABLED`, `OPERATOR.FORBIDDEN` (no current operator grant), `OPERATOR.CAPABILITY_REQUIRED`
        (the grant does not cover this route), `OPERATOR.ORIGIN_REJECTED`, or `OPERATOR.CSRF_REJECTED`
        on unsafe methods.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorContentForbidden:
      description: '`OPERATOR.CONTENT_NOT_ELIGIBLE` when the message is in the organization but is
        not an outbound organization broadcast message (ordinary outbound, inbound, or a synced copy),
        or any code of `OperatorForbidden`, including `OPERATOR.CAPABILITY_REQUIRED` for a grant
        without `mail_content:read`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorMessageNotFound:
      description: '`MAILBOX.MESSAGE_NOT_FOUND`: no message with this ID is stored in a mailbox of
        this organization.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignInForbidden:
      description: '`OPERATOR.ORIGIN_REJECTED` when `Origin` is missing or not allowed, or `OPERATOR.FORBIDDEN`
        when valid credentials belong to an account without an operator grant.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignOutRejected:
      description: '`OPERATOR.ORIGIN_REJECTED` or `OPERATOR.CSRF_REJECTED` when a session cookie is presented.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorInvalidCredentials:
      description: '`AUTH.INVALID_CREDENTIALS` for unknown, wrong, or disabled accounts.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorTargetProtected:
      description: '`OPERATOR.TARGET_PROTECTED`: the target account holds an operator grant, including
        the caller''s own.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorUserNotFound:
      description: '`USER.NOT_FOUND`, or `COMMON.NOT_FOUND` when the path ID is not all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorOrganizationNotFound:
      description: '`ORGANIZATION.NOT_FOUND` for an unknown organization, `WEBHOOK.DELIVERY_NOT_FOUND`
        for a delivery outside the organization, or `COMMON.NOT_FOUND` when a constrained path ID is not
        all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or not app-scoped.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: unknown fields, `null`, or a value outside the definition
        schema.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorWebhookReplayNotAllowed:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED`: the delivery is not terminal, reached the replay limit,
        or its endpoint is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
