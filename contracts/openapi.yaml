      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    MailTemplateVariables:
      type: object
      description: Values by variable name; names are a letter followed by letters, digits, or underscores.
      maxProperties: 100
      propertyNames:
        pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
      additionalProperties:
        type: string
        maxLength: 2000
    MailTemplateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - subject
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        subject:
          type: string
          description: May use `{{name}}` and `{{name|fallback}}` placeholders, as may both bodies.
          minLength: 1
          maxLength: 998
        html:
          type: string
          description: At least one of `html` and `text` is required.
          maxLength: 262144
        text:
          type: string
          maxLength: 262144
        sample_variables:
          $ref: '#/components/schemas/MailTemplateVariables'
        design:
          $ref: '#/components/schemas/MailTemplateDesign'
        kind:
          $ref: '#/components/schemas/MailTemplateKind'
        key:
          type: string
          description: Required for a transactional template and refused for a standard one. Unique in the
            organization; the API refers to the template by it.
          pattern: '^[a-z][a-z0-9-]{0,63}$'
          maxLength: 64
        from_address:
          type: string
          description: Required for a transactional template and refused for a standard one. A bare address
            whose domain is a verified domain of the organization (or, with the `log` provider, the instance
            mail domain). Stored in lowercase.
          minLength: 3
          maxLength: 320
        from_name:
          type: string
          description: Optional display name of a transactional template's sender.
          maxLength: 100
        variable_definitions:
          type: array
          description: For a transactional template only; a standard template refuses a non-empty list.
            Every placeholder must be declared and every declaration used, so it is empty when the
            content has no placeholders. A secret variable must be required;
            a required variable must have no fallback and an optional one must have one.
          maxItems: 100
          items:
            $ref: '#/components/schemas/MailTemplateVariableDefinition'
    MailTemplateKind:
      type: string
      description: '`standard` templates serve mailbox sends, template tests, and broadcasts;
