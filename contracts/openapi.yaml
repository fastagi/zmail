        - $ref: '#/components/parameters/MailboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMailboxWebhookSettingRequest'
      responses:
        '200':
          description: The mailbox after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The mailbox is personal (`MAILBOX.ACCESS_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/triage-setting:
    put:
      operationId: setMailboxTriageSetting
      summary: Turn AI triage for a mailbox on or off
      description: A personal mailbox's switch belongs to its owner alone; a shared mailbox's needs
        `manage_members`. Turning it on needs an instance model (`409 MAILBOX.TRIAGE_UNAVAILABLE`
        otherwise). Only mail received while both this switch and the organization switch are on is
        queued; earlier mail is never classified.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMailboxTriageSettingRequest'
      responses:
        '200':
          description: The mailbox after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: AI triage is off for the organization, or the instance has no model
            (`MAILBOX.TRIAGE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/role-assignment:
    put:
      operationId: setMailboxRoleAssignment
      summary: Put a mailbox in a mail role or take it out
      description: Needs `administer` on the mailbox. Setting the current value succeeds and changes
