        - meta
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MailSuppression'
        meta:
          $ref: '#/components/schemas/MailSuppressionPageMeta'
    TransactionalLogPageResponse:
