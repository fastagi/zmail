    MailEventType:
      type: string
      description: "`accepted`: the provider took the message. `delivered`: the recipient's server
        accepted it. `deferred`: a temporary failure that is still being retried. `bounced`: refused for
        good. `failed`: the provider gave up. `rejected`: not attempted, for example a suppressed
        recipient. `complained`: reported as spam."
      enum:
        - accepted
        - delivered
        - deferred
        - bounced
        - failed
        - rejected
        - complained
    MailEventSummary:
      type: string
      description: The most severe current state among the recipients of an outbound message, where a
        recipient's current state is its latest event. Empty when nothing was recorded, which is always
        the case for inbound messages.
      enum:
        - ''
        - accepted
        - delivered
        - deferred
        - bounced
        - failed
        - rejected
        - complained
    MailEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - recipient
        - detail
        - occurred_at
      properties:
        type:
          $ref: '#/components/schemas/MailEventType'
        recipient:
          type: string
          description: The address the event is about; empty for a message-level event.
          maxLength: 320
        detail:
          type: string
          description: Short machine-readable reason such as `5.1.1 permanent_failure`; never provider free text.
          maxLength: 255
        occurred_at:
          type: string
          format: date-time
    MailDeliveryEvent:
      type: object
      additionalProperties: false
      required:
        - message_id
        - message_kind
        - type
        - duplicate
      properties:
        message_id:
          description: The id of the matched message in the table `message_kind` names.
          $ref: '#/components/schemas/PositiveID'
        message_kind:
          type: string
          description: '`mailbox` when the event matched a mailbox message, `transactional` when it matched a
            transactional message.'
          enum:
            - mailbox
            - transactional
        type:
          $ref: '#/components/schemas/MailEventType'
        duplicate:
          type: boolean
    MailDeliveryEventResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailDeliveryEvent'
    TransactionalMode:
      type: string
      description: '`live` messages come from live keys and live console test sends; `test` messages come from
        test keys and test console sends, are always simulated, and never call the provider.'
      enum:
        - live
        - test
    TransactionalMessageStatus:
      type: string
      description: '`queued` until the provider takes the message (or the simulator decides), then `sent`;
        `failed` when the provider refused it, its outcome is unknown, retries ran out, it waited more than an
        hour, or its sender domain lost verification; `suppressed` when the recipient is on the
        organization''s suppression list (nothing is sent).'
      enum:
        - queued
        - sent
        - failed
        - suppressed
    TransactionalQueuedReason:
      type:
        - string
        - 'null'
      description: '`send_limit` while a queued message waits for room in the transactional lane; `retry` while it
        waits for a retry after a temporary provider failure; otherwise null.'
      enum:
        - send_limit
        - retry
        - null
    TransactionalLastEvent:
      type:
        - string
        - 'null'
      description: The most severe delivery event recorded for the message (see MAILBOXES.md, Delivery Events);
        null when none was recorded.
      enum:
        - accepted
        - delivered
        - deferred
        - bounced
        - failed
        - rejected
        - complained
        - null
    TransactionalMessageRequest:
      type: object
      additionalProperties: false
      required:
        - template
        - to
      properties:
        template:
          type: string
          description: The `key` of a transactional template of the organization.
          pattern: '^[a-z][a-z0-9-]{0,63}$'
          maxLength: 64
        to:
          type: string
          description: One bare address. Surrounding whitespace is trimmed and the address is lowercased; a
            display name or several addresses are refused.
          minLength: 3
          maxLength: 320
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    TransactionalTestSendRequest:
      type: object
      additionalProperties: false
      required:
        - template
        - mode
      properties:
        template:
          type: string
          description: The `key` of a transactional template of the organization.
          pattern: '^[a-z][a-z0-9-]{0,63}$'
          maxLength: 64
        mode:
          $ref: '#/components/schemas/TransactionalMode'
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    TransactionalSender:
      type: object
      additionalProperties: false
      description: The template's sender when the message was created.
      required:
        - address
        - name
      properties:
        address:
          type: string
          maxLength: 320
        name:
          type: string
          description: The display name; empty when the template has none.
          maxLength: 100
    TransactionalMessageEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - detail
        - occurred_at
      properties:
        type:
          $ref: '#/components/schemas/MailEventType'
        detail:
          type: string
          description: Short machine-readable reason such as `5.1.1 permanent_failure` or `simulated`; never
            provider free text.
          maxLength: 255
        occurred_at:
          type: string
          format: date-time
    TransactionalMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - mode
        - simulated
        - template
        - from
        - to
        - to_masked
        - subject
        - variables
        - status
        - queued_reason
        - failure_code
        - last_event
        - attempts
        - idempotency_key
        - created_at
        - sent_at
        - events
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        mode:
          $ref: '#/components/schemas/TransactionalMode'
        simulated:
          type: boolean
          description: True for a simulator address or a test-mode message; the provider is never called.
        template:
          type: string
          description: The template key when the message was created; kept after the template is deleted.
          maxLength: 64
        from:
          $ref: '#/components/schemas/TransactionalSender'
        to:
          type: string
          description: The full recipient, lowercased. Returned only on API key routes and console test sends.
          maxLength: 320
        to_masked:
          type: string
          description: The recipient with the local part cut to its first two characters (one when it has at
            most two) followed by `••`, domain kept, for example `li••@example.com`.
          maxLength: 330
        subject:
          type: string
          description: The rendered subject with every secret variable masked.
          maxLength: 998
        variables:
          type: object
          description: The variables as sent, with secret values masked. A secret value that is an `http` or
            `https` URL with a host shows `<host>/••••`; any other secret value shows `••••••`.
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 2000
        status:
          $ref: '#/components/schemas/TransactionalMessageStatus'
        queued_reason:
          $ref: '#/components/schemas/TransactionalQueuedReason'
        failure_code:
          type:
            - string
            - 'null'
          description: Stable reason when `status` is `failed`, such as `send.expired`, `send.sender_unverified`,
            `transport.unknown_outcome`, or a provider code; null otherwise.
          maxLength: 120
        last_event:
          $ref: '#/components/schemas/TransactionalLastEvent'
        attempts:
          type: integer
          description: Provider calls made so far; at most 4.
          minimum: 0
          maximum: 4
        idempotency_key:
          type:
            - string
            - 'null'
          description: The `Idempotency-Key` the message was created with; null once released 24 hours later.
          maxLength: 255
        created_at:
          type: string
          format: date-time
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
        events:
          type: array
          description: Up to 50 events, oldest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/TransactionalMessageEvent'
    TransactionalMessageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/TransactionalMessage'
    TransactionalLogEntry:
      type: object
      additionalProperties: false
      description: A transactional message as the console log shows it, without the full recipient or the
        variables.
      required:
        - id
        - mode
        - simulated
        - template
        - to_masked
        - subject
        - status
        - queued_reason
        - failure_code
        - last_event
        - idempotency_key
        - created_at
        - sent_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        mode:
          $ref: '#/components/schemas/TransactionalMode'
        simulated:
          type: boolean
        template:
          type: string
          maxLength: 64
        to_masked:
          type: string
          maxLength: 330
        subject:
          type: string
          description: The rendered subject with every secret variable masked.
          maxLength: 998
        status:
          $ref: '#/components/schemas/TransactionalMessageStatus'
        queued_reason:
          $ref: '#/components/schemas/TransactionalQueuedReason'
        failure_code:
          type:
            - string
            - 'null'
          maxLength: 120
        last_event:
          $ref: '#/components/schemas/TransactionalLastEvent'
        idempotency_key:
          type:
            - string
            - 'null'
          maxLength: 255
        created_at:
          type: string
          format: date-time
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
    TransactionalLogEntryDetail:
      type: object
      additionalProperties: false
      description: A log entry with its sender, masked variables, and events. Still without the full recipient.
      required:
        - id
        - mode
        - simulated
        - template
        - to_masked
        - subject
        - status
        - queued_reason
        - failure_code
        - last_event
        - idempotency_key
        - created_at
        - sent_at
        - from
        - variables
        - events
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        mode:
          $ref: '#/components/schemas/TransactionalMode'
        simulated:
          type: boolean
        template:
          type: string
          maxLength: 64
        to_masked:
          type: string
          maxLength: 330
        subject:
          type: string
          maxLength: 998
        status:
          $ref: '#/components/schemas/TransactionalMessageStatus'
        queued_reason:
          $ref: '#/components/schemas/TransactionalQueuedReason'
        failure_code:
          type:
            - string
            - 'null'
          maxLength: 120
        last_event:
          $ref: '#/components/schemas/TransactionalLastEvent'
        idempotency_key:
          type:
            - string
            - 'null'
          maxLength: 255
        created_at:
          type: string
          format: date-time
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
        from:
          $ref: '#/components/schemas/TransactionalSender'
        variables:
          type: object
          description: The variables as sent, with secret values masked.
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 2000
        events:
          type: array
          description: Up to 50 events, oldest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/TransactionalMessageEvent'
    TransactionalLogEntryResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/TransactionalLogEntryDetail'
    TransactionalLogPageMeta:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - total_24h
      properties:
        next_cursor:
          description: Pass as `cursor` to read the next, older page; null on the last page.
          type:
            - string
            - 'null'
          maxLength: 128
        total_24h:
          type: integer
          description: Messages of the requested mode created in the last 24 hours, of the requested `template`
            when one is given, ignoring the other filters; counting stops at 10000.
          minimum: 0
          maximum: 10000
    MailSendLaneUsage:
      type: object
      additionalProperties: false
      required:
        - lane
        - limit
        - used
        - waiting
      properties:
        lane:
          type: string
          enum:
            - transactional
            - broadcast
            - personal
        limit:
          type: integer
          description: The lane's rolling 24-hour limit.
          minimum: 1
          maximum: 100000
        used:
          type: integer
          description: Provider calls of the lane that started in the window, failed attempts included.
          minimum: 0
        waiting:
          type: integer
          description: For `transactional` and `personal`, messages waiting for room in the lane; for
            `broadcast`, the pending recipients of broadcasts paused because the lane was full.
          minimum: 0
    MailSendLaneUsageList:
      type: object
      additionalProperties: false
      required:
        - lanes
        - window_hours
        - computed_at
      properties:
        lanes:
          type: array
          description: Always the three lanes, in the order `transactional`, `broadcast`, `personal`.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/MailSendLaneUsage'
        window_hours:
          const: 24
        computed_at:
          type: string
          format: date-time
          description: The end of the window the usage was counted in.
    MailSendLaneUsageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailSendLaneUsageList'
    MailSuppressionReason:
      type: string
      enum:
        - bounced
        - complained
    MailSuppression:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - reason
        - source
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        email:
          type: string
          description: The suppressed address, lowercased.
          maxLength: 320
        reason:
          $ref: '#/components/schemas/MailSuppressionReason'
        source:
          type: string
          description: What first suppressed the address; `backfill` is a contact suppressed before the list
            existed.
          enum:
            - broadcast
            - transactional
            - backfill
        created_at:
          type: string
          format: date-time
    MailSuppressionPageMeta:
      type: object
      additionalProperties: false
      required:
