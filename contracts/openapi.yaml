  /v1/mailboxes/{mailbox_id}/handovers:
    post:
      operationId: handOverMailbox
      summary: Hand a personal mailbox over to a successor
      description: Owners and admins only. The mailbox becomes shared, the successor becomes a `send` member,
        the former owner keeps no access or read records, and `sealed_before` is set to the time the owner
        left the organization when they are gone, otherwise to now. Messages and broadcasts created before
        it are sealed. Writes a `handed_over` access event.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandOverMailboxRequest'
      responses:
        '201':
          description: The mailbox after the handover, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The mailbox is already shared (`MAILBOX.ACCESS_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, or the successor is not a member of the organization
            (`MAILBOX.ACCESS_INVALID`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/sealed-messages:
    delete:
      operationId: deleteMailboxSealedMessages
      summary: Delete a mailbox's sealed history
      description: Owners and admins only. Sealed broadcasts still scheduled, sending, or paused are cancelled
        first; then sealed broadcasts with their recipients and sealed messages with their events and
        attachments are deleted. The seal boundary stays. Writes a `sealed_deleted` access event.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMailboxSealedMessagesRequest'
      responses:
