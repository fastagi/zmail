              schema:
                $ref: '#/components/schemas/MailDomainResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-domains/{domain_id}/receiving:
    post:
      operationId: enableMailDomainReceiving
      summary: Start receiving on a send-only domain
      description: Turns a `send_only` domain into `send_receive` and starts its setup in the background, which
        enables Email Routing and gives each live mailbox on the domain without a routing rule its rule. Email
        Routing replaces the domain's MX, so mail stops reaching the previous mail service. A domain that already
        receives is answered unchanged. Only owners and admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailDomainID'
      responses:
