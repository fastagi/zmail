  /v1/mail-domains/{domain_id}/checks:
    post:
      operationId: checkMailDomain
      summary: Check the domain's DNS records
      description: Reads the zone and compares it with what receiving, sending, and DMARC need, without writing
        DNS. The domain becomes verified when every record is present. While the domain's managed zone is
        pending, it instead asks Cloudflare to look for the zone's name servers now; `zone_check_limited` is true
        when Cloudflare refused because it looked too recently. Only owners and admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailDomainID'
      responses:
