        - template_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        mailbox_id:
          $ref: '#/components/schemas/PositiveID'
        direction:
          $ref: '#/components/schemas/MailDirection'
        status:
          $ref: '#/components/schemas/MailStatus'
        from:
          $ref: '#/components/schemas/MailAddress'
        to:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 320
        cc:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 320
        subject:
          type: string
          maxLength: 998
        read:
          type: boolean
        failure_code:
          type: string
          description: Stable provider or transport reason when `status` is `failed`; empty otherwise.
          maxLength: 120
        last_event:
          $ref: '#/components/schemas/MailEventSummary'
        attachment_count:
          type: integer
          description: How many files the message has; the detail lists them.
          minimum: 0
          maximum: 10
        template_id:
          description: The template the message was rendered from; null when none was used.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
        created_at:
          type: string
          format: date-time
    MailMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - mailbox_id
        - direction
        - status
        - from
        - to
        - cc
        - subject
        - read
        - failure_code
        - last_event
        - attachment_count
        - template_id
        - created_at
        - text_body
        - html_body
        - message_id
        - in_reply_to
        - events
        - attachments
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        mailbox_id:
          $ref: '#/components/schemas/PositiveID'
        direction:
          $ref: '#/components/schemas/MailDirection'
        status:
          $ref: '#/components/schemas/MailStatus'
        from:
          $ref: '#/components/schemas/MailAddress'
        to:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 320
        cc:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 320
        subject:
          type: string
          maxLength: 998
        read:
          type: boolean
        failure_code:
          type: string
          maxLength: 120
        last_event:
          $ref: '#/components/schemas/MailEventSummary'
        attachment_count:
          type: integer
          description: How many files the message has; the detail lists them.
          minimum: 0
          maximum: 10
        template_id:
          description: The template the message was rendered from; null when none was used.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        text_body:
          type: string
          maxLength: 262144
        html_body:
          type: string
          description: Untrusted HTML from the sender. Render it only inside a sandbox.
          maxLength: 262144
        message_id:
          type: string
          description: RFC 5322 Message-ID without angle brackets; empty when unknown.
          maxLength: 998
        in_reply_to:
          type: string
          maxLength: 998
        events:
          type: array
          description: Delivery history of an outbound message, oldest first; empty for inbound messages.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MailEvent'
        attachments:
          type: array
          description: The files of the message, without their content.
          maxItems: 10
          items:
            $ref: '#/components/schemas/MailAttachment'
    MailAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - content_type
        - size
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        filename:
          type: string
          description: Bare file name without a path.
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          description: Media type the sender declared. It is untrusted and never used to serve the file.
          minLength: 1
          maxLength: 127
        size:
          type: integer
          description: Size in bytes.
          minimum: 0
          maximum: 4194304
    MailAttachmentInput:
      type: object
      additionalProperties: false
      required:
        - filename
        - content
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          description: Media type; `application/octet-stream` when absent or unusable.
          maxLength: 127
        content:
          type: string
          description: The file as standard base64. All files of a message decode to at most 4 MiB.
          minLength: 1

    MailBroadcastStatus:
      type: string
      description: '`paused` keeps the pending recipients without sending; `stop_reason` says why.'
      enum:
        - draft
        - scheduled
        - sending
        - paused
        - sent
        - canceled
    MailBroadcastRecipientStatus:
      type: string
      enum:
        - pending
        - sent
        - failed
        - skipped
        - canceled
    MailBroadcastRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - mailbox_id
        - template_id
        - list_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 400
        mailbox_id:
          $ref: '#/components/schemas/PositiveID'
        template_id:
          $ref: '#/components/schemas/PositiveID'
        list_id:
          $ref: '#/components/schemas/PositiveID'
        unsubscribe_label:
          type: string
          description: Text of the unsubscribe link Zmail adds when the template does not use `{{unsubscribe_url}}`;
            `Unsubscribe` when empty.
          maxLength: 200
        test_percent:
          type: integer
          description: Send to this share of the list first, picked at random (at least one recipient).
            The rest waits `test_wait_minutes` and is sent only if the test wave's bounce and complaint
            rates are acceptable. 0 or absent sends to everyone at once.
          minimum: 0
          maximum: 50
        test_wait_minutes:
          type: integer
          description: Minutes between the end of the test wave and the rest, 5 to 1440; 0 or absent means 30.
          minimum: 0
          maximum: 1440
        variables:
          $ref: '#/components/schemas/MailBroadcastVariables'
    MailBroadcastVariables:
      type: object
      description: Template values shared by every recipient, at most 100. A contact's properties override
        a value of the same name. `email`, `first_name`, `last_name`, and `unsubscribe_url` come from each
        contact and cannot be set here. Absent means none.
      maxProperties: 100
      propertyNames:
        pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
      additionalProperties:
        type: string
        maxLength: 2000
    MailBroadcastSendRequest:
      type: object
      additionalProperties: false
      properties:
        scheduled_at:
          description: When to start; omitted, null, or in the past starts now. At most a year ahead.
          type:
            - string
            - 'null'
          format: date-time
    MailBroadcastCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - pending
        - sent
        - failed
        - skipped
        - canceled
        - bounced
        - complained
      properties:
        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
        bounced:
          type: integer
          description: Sent or failed recipients whose message bounced or was rejected, at send time or later.
          minimum: 0
        complained:
          type: integer
          description: Sent recipients whose message was later reported as spam.
          minimum: 0
    MailBroadcast:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - mailbox_id
        - template_id
        - list_id
        - unsubscribe_label
        - variables
        - status
        - scheduled_at
        - started_at
        - finished_at
        - stop_reason
        - test_percent
        - test_wait_minutes
        - current_wave
        - resume_at
        - safety_override
        - counts
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          maxLength: 100
        mailbox_id:
          $ref: '#/components/schemas/PositiveID'
        template_id:
          $ref: '#/components/schemas/PositiveID'
        list_id:
          $ref: '#/components/schemas/PositiveID'
        unsubscribe_label:
          type: string
          maxLength: 50
        variables:
          $ref: '#/components/schemas/MailBroadcastVariables'
        status:
          $ref: '#/components/schemas/MailBroadcastStatus'
        scheduled_at:
          type:
            - string
            - 'null'
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        stop_reason:
          type: string
          description: Why the broadcast is held. `send_limit_reached` while the organization's 24-hour send
            limit holds a sending broadcast; for a paused one `test_wave_complete` (waiting until `resume_at`),
            `bounce_rate_high` or `complaint_rate_high` (the health check stopped it), or `paused_by_owner`.
            Empty otherwise.
          maxLength: 64
        test_percent:
          type: integer
          minimum: 0
          maximum: 50
        test_wait_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        current_wave:
          type: integer
          description: 1 while only the test wave may be sent, 2 once everyone may.
          minimum: 1
          maximum: 2
        resume_at:
          description: When a waiting test wave is checked and the rest continues.
          type:
            - string
            - 'null'
          format: date-time
        safety_override:
          type: boolean
          description: An owner resumed the broadcast after the health check paused it; it is not paused
            automatically again.
        counts:
          $ref: '#/components/schemas/MailBroadcastCounts'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MailBroadcastResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailBroadcast'
    MailBroadcastStatusResponse:
