          const: 0
        message:
          type: string
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MailTemplateSummary'
    MailTemplatePreviewRequest:
      type: object
      additionalProperties: false
      description: Give exactly one of `template_id` and `source`. Sample values fill variables not in
        `variables`.
      properties:
        template_id:
          $ref: '#/components/schemas/PositiveID'
        source:
          $ref: '#/components/schemas/MailTemplateRequest'
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    MailTemplatePreview:
      type: object
      additionalProperties: false
      required:
        - subject
        - html_body
        - text_body
        - variables
        - missing
      properties:
        subject:
          type: string
        html_body:
          type: string
          description: Untrusted HTML. Render it only inside a sandbox.
        text_body:
          type: string
        variables:
          type: array
          items:
            type: string
        missing:
          type: array
          description: Variables with neither a value nor a fallback; a real send would be refused.
          items:
            type: string
    MailTemplatePreviewResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailTemplatePreview'
    MailTemplateTestRequest:
