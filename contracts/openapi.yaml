        content:
          type: string
          description: An IPv4 address for A, an IPv6 address for AAAA, a host for CNAME and MX, at most 2048
            characters for TXT.
          minLength: 1
          maxLength: 4096
        ttl:
          type: integer
          description: '`1` (automatic, the default) or 60 to 86400.'
        priority:
          type: integer
          description: Required for MX, from 0 to 65535; ignored otherwise.
        proxied:
          type: boolean
          description: Proxy through Cloudflare; only A, AAAA, and CNAME records.
          default: false
