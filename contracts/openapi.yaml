      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        error:
          type: string
        request_id:
          type: string
          minLength: 1
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
        - errors
      properties:
        code:
          const: 422
        error_code:
          const: COMMON.VALIDATION_FAILED
        message:
          type: string
        errors:
          $ref: '#/components/schemas/FieldErrors'
        request_id:
          type: string
          minLength: 1
