        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMailDomain
      summary: Remove a connected domain
      description: Allowed only when no mailbox uses the domain and no transactional template sends from it.
        Zmail forgets the domain and leaves its DNS and Cloudflare settings as they are. Only owners and
        admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailDomainID'
      responses:
        '204':
          description: The domain is removed.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A mailbox still uses the domain, or a transactional template sends from it
            (`MAILBOX.DOMAIN_IN_USE`).
