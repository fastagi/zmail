        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/access-events:
    get:
      operationId: listMailboxAccessEvents
      summary: List a mailbox's access history, newest first
      description: Needs `see_history` on the mailbox.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated access events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxAccessEventPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/messages:
    get:
      operationId: listMailMessages
      summary: List the messages of a mailbox, newest first
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - name: direction
          in: query
          required: false
          description: Keep only received (`inbound`) or sent (`outbound`) messages.
          schema:
            $ref: '#/components/schemas/MailDirection'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of message summaries without bodies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessagePageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: sendMailMessage
      summary: Send a message from a mailbox
      description: The message is stored, handed to the mail provider, and returned with its real outcome.
        When the provider does not accept it the response is `502 MAILBOX.DELIVERY_FAILED` and the
        message stays in the mailbox with status `failed`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMailMessageRequest'
      responses:
        '200':
          description: The `Idempotency-Key` already named a sent message; it is returned and nothing is sent again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '201':
          description: The provider accepted the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The `Idempotency-Key` was used with different content (`MAILBOX.IDEMPOTENCY_CONFLICT`),
            or its first attempt has not finished (`MAILBOX.SEND_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, the recipients, subject, body, or reply reference are
            unusable (`MAILBOX.MESSAGE_INVALID`), or the `Idempotency-Key` is not 1 to 255 printable
            ASCII characters (`MAILBOX.IDEMPOTENCY_KEY_INVALID`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The organization reached the rolling 24-hour send limit (`MAILBOX.SEND_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The mail provider did not accept the message (`MAILBOX.DELIVERY_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/messages/{message_id}:
    get:
      operationId: getMailMessage
      summary: Get a message with its bodies
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailMessageID'
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateMailMessage
      summary: Mark a message read or unread
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailMessageID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMailMessageRequest'
      responses:
        '200':
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMailMessage
      summary: Delete a message
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailMessageID'
      responses:
        '204':
          description: The message is deleted.
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/messages/{message_id}/attachments/{attachment_id}:
    get:
      operationId: downloadMailAttachment
      summary: Download one attached file
      description: The file is always served as an opaque download; its declared media type is in the
        message detail and is never used as the response type.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailMessageID'
        - $ref: '#/components/parameters/MailAttachmentID'
      responses:
        '200':
          description: The file bytes.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
                const: private, no-store
            Content-Disposition:
              description: '`attachment` with the stored file name.'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/inbound-mail-messages:
    post:
      operationId: receiveInboundMailMessage
      summary: Accept one raw message from the mail edge
      description: 'Called by the Cloudflare Email Worker, not by browsers. The body is the raw RFC 5322
        message. `X-Mailbox-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256>` computed with the
        shared inbound secret over `<t>.<lowercase recipient>.<body>`; a timestamp more than five
        minutes from server time is rejected. A repeated delivery of the same message to the same
        mailbox returns `200` with `duplicate: true`.'
      tags:
        - Mailboxes
      security: []
      parameters:
        - name: X-Mailbox-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Mailbox-Recipient
          in: header
          required: true
          description: The envelope recipient the edge accepted the message for.
          schema:
            type: string
            minLength: 3
            maxLength: 320
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          description: The message was already stored by an earlier delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '201':
          description: The message is stored in the recipient's mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '401':
          description: The signature is missing, stale, or wrong (`MAILBOX.INBOUND_SIGNATURE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No mailbox has the recipient address (`MAILBOX.RECIPIENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The raw message exceeds 5 MiB (`MAILBOX.INBOUND_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body is not a parseable message with a sender (`MAILBOX.INBOUND_UNPARSEABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Inbound mail has no shared secret configured (`MAILBOX.INBOUND_DISABLED`), or the
            database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/outbound-mail-messages:
    post:
      operationId: sendOutboundMailMessage
      summary: Send a message with an API key
      description: "For backend services. The key must hold the `mail:send` scope, and `from` must be the
        address of a mailbox of the organization named by `Organization-Id`, of which the key's owner must be a member. Outcomes are the same as sending from a mailbox: a
        message the provider does not accept answers `502 MAILBOX.DELIVERY_FAILED` and is kept with
        status `failed`."
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOutboundMailMessageRequest'
      responses:
        '200':
          description: The `Idempotency-Key` already named a sent message; it is returned and nothing is sent
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '201':
          description: The provider accepted the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The organization has no mailbox with the `from` address (`MAILBOX.NOT_FOUND`), or the key's owner is not a member of it (`ORGANIZATION.NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The `Idempotency-Key` was used with different content (`MAILBOX.IDEMPOTENCY_CONFLICT`),
            or its first attempt has not finished (`MAILBOX.SEND_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, the message is unusable (`MAILBOX.MESSAGE_INVALID`), or the
            `Idempotency-Key` is malformed (`MAILBOX.IDEMPOTENCY_KEY_INVALID`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The organization reached the rolling 24-hour send limit (`MAILBOX.SEND_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The mail provider did not accept the message (`MAILBOX.DELIVERY_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/outbound-mail-messages/{message_id}:
    get:
      operationId: getOutboundMailMessage
      summary: Get a message the organization sent
      description: The key must hold the `mail:read` scope. Only outbound messages are visible here.
      tags:
        - Mailboxes
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailMessageID'
      responses:
        '200':
          description: The message with its delivery status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-messages:
    get:
      operationId: listMailLog
      summary: List messages across every mailbox of the organization, newest first
      description: The log carries summaries without bodies; read a message through its mailbox.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MailDirection'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MailStatus'
        - name: mailbox_id
          in: query
          required: false
          description: Keep only one mailbox. Another organization's mailbox matches nothing.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: q
          in: query
          required: false
          description: Case-insensitive match on the subject, the sender address, or a recipient address.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailLogPageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-message-stats:
    get:
      operationId: listMailMessageStats
      summary: Count the organization's mail per UTC day
      description: Returns one entry for every day of the window, oldest first, including days without mail.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: days
          in: query
          required: false
          description: Window length ending today (UTC). Defaults to 7.
          schema:
            type: integer
            minimum: 1
            maximum: 90
      responses:
        '200':
          description: Per-day counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDayStatsListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-delivery-events:
    post:
      operationId: receiveMailDeliveryEvent
      summary: Accept one provider delivery event from the mail edge
      description: "Called by the Cloudflare Email Worker's queue consumer, not by browsers. The body is
        one Cloudflare Email Sending event (`cf.email.sending.message.*`, schema version 1),
        unchanged. `X-Mailbox-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256>` computed with the
        shared inbound secret over `<t>.delivery-event.<body>`. A repeated event returns `200` with
        `duplicate: true`."
      tags:
        - Mailboxes
      security: []
      parameters:
        - name: X-Mailbox-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Cloudflare Email Sending event. Only identifiers, the recipient, status codes, and
                classifications are read.
      responses:
        '200':
          description: The event was already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDeliveryEventResponse'
        '201':
          description: The event is recorded and the message summary is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDeliveryEventResponse'
        '401':
          description: The signature is missing, stale, or wrong (`MAILBOX.INBOUND_SIGNATURE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No outbound message has the event's message id (`MAILBOX.MESSAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: The body is not a usable Email Sending event (`MAILBOX.DELIVERY_EVENT_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No shared secret is configured (`MAILBOX.INBOUND_DISABLED`), or the database is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque server-side session credential returned by the FastBuild login API.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-fastbuild_operator
      description: HttpOnly platform-operator session cookie issued by POST /v1/operator/session. The
        name is `fastbuild_operator` outside production or `OPERATOR_SESSION_COOKIE_NAME` when configured.
        Unsafe methods also require an allowed `Origin` and the `X-CSRF-Token` header; see OPERATORS.md.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: A user-owned API key from POST /v1/api-keys. Each operation names the scopes the
        key must hold; see API_KEYS.md.
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    AuditCursor:
      name: cursor
      in: query
      description: Opaque keyset position from `meta.next_cursor`; absent or empty requests the newest
        page. The removed `page` parameter is rejected with 400.
      schema:
        type: string
        maxLength: 128
    PerPage:
      name: per_page
      in: query
      description: Requested page size, capped by the API.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    APIKeyID:
      name: api_key_id
      in: path
      required: true
      description: Positive API key identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationContext:
      name: Organization-Id
      in: header
      required: true
      description: Active organization for organization-scoped routes; verified against membership.
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,15}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag of the version the caller read; required for optimistic concurrency.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by the operator session endpoints.
      schema:
        type: string
        minLength: 1
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization identifier; resolved only through the caller's membership.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationMemberID:
      name: member_id
      in: path
      required: true
      description: Organization membership identifier, not the user's global ID.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Organization invitation identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    PermissionAccessRoleID:
      name: access_role_id
      in: path
      required: true
      description: Access role identifier within the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationID:
      name: notification_id
      in: path
      required: true
      description: Positive notification identifier owned by the caller.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationStatusFilter:
      name: status
      in: query
      description: Read-state filter.
      schema:
        type: string
        enum:
          - all
          - unread
        default: all
    AssetID:
      name: asset_id
      in: path
      required: true
      description: Lowercase canonical asset UUID owned by the caller.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    AssetStatusFilter:
      name: status
      in: query
      description: Lifecycle filter; deleted assets are never listed.
      schema:
        type: string
        enum:
          - all
          - pending
          - ready
          - rejected
        default: all
    AssetTransferToken:
      name: transfer_token
      in: path
      required: true
      description: Opaque, short-lived signed transfer token issued in a local-driver grant URL.
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned setting key for the route's scope, such as `localization.locale`.
      schema:
        type: string
        minLength: 1
    SettingIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Aggregate `"settings-<sha256>"` validator from a previous response; `*` and weak forms
        also match.
      schema:
        type: string
    WebhookEndpointID:
      name: webhook_endpoint_id
      in: path
      required: true
      description: Positive webhook endpoint identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryID:
      name: webhook_delivery_id
      in: path
      required: true
      description: Positive webhook delivery identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryEndpointFilter:
      name: endpoint_id
      in: query
      description: Only deliveries for this endpoint (canonical positive decimal).
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryStatusFilter:
      name: status
      in: query
      description: Only deliveries in this state.
      schema:
        $ref: '#/components/schemas/WebhookDeliveryStatus'
    WebhookTestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one canonical key; a retry with the same key returns the originally queued
        delivery.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$
    OperatorOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly equal one of `OPERATOR_ALLOWED_ORIGINS`; otherwise 403 OPERATOR.ORIGIN_REJECTED.
      schema:
        type: string
        minLength: 1
    OperatorUserID:
      name: user_id
      in: path
      required: true
      description: Positive user identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorOrganizationID:
      name: organization_id
      in: path
      required: true
      description: Positive organization identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorWebhookDeliveryID:
      name: delivery_id
      in: path
      required: true
      description: Canonical positive decimal delivery identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorSettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned app-scope setting key, such as `branding.display_name`.
      schema:
        type: string
        minLength: 1
    MailboxID:
      name: mailbox_id
      in: path
      required: true
      description: Positive mailbox identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailboxMemberUserID:
      name: user_id
      in: path
      required: true
      description: Positive user identifier of the mailbox member.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailBroadcastID:
      name: broadcast_id
      in: path
      required: true
      description: Positive mail broadcast identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailContactID:
      name: contact_id
      in: path
      required: true
      description: Positive mail contact identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailContactListID:
      name: list_id
      in: path
      required: true
      description: Positive mail contact list identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailDomainID:
      name: domain_id
      in: path
      required: true
      description: Positive connected mail domain identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailTemplateID:
      name: template_id
      in: path
      required: true
      description: Positive mail template identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailMessageID:
      name: message_id
      in: path
      required: true
      description: Positive mail message identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailAttachmentID:
      name: attachment_id
      in: path
      required: true
      description: Positive mail attachment identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    MailIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Names this send within its mailbox. A repeat with the same key and the same content
        returns the first attempt's outcome and does not call the provider again.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
  responses:
    Forbidden:
      description: The caller is authenticated but not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The `If-Match` version is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: The operation requires an `If-Match` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests; `Retry-After` is set when the reset time is known.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The resource existed but has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInput:
      description: The request body or semantic input is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    APIKeyNotFound:
      description: The API key is missing or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServiceUnavailable:
      description: Required persistence or another dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationInvalidCredentials:
      description: Unknown identifier, wrong password, or inactive account (`AUTH.INVALID_CREDENTIALS`);
        the cases are deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationAccountDisabled:
      description: The session belongs to a disabled account (`AUTH.ACCOUNT_DISABLED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrganizationContextInvalid:
      description: '`ORGANIZATION.CONTEXT_REQUIRED` when `Organization-Id` is absent, `ORGANIZATION.CONTEXT_INVALID`
        when it is malformed or repeated, or `COMMON.INVALID_INPUT` for malformed JSON or path IDs.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionAccessRoleValidationFailed:
      description: Field validation failed (`COMMON.VALIDATION_FAILED` with `errors`), or a requested
        permission key is not in the code-owned catalog (`PERMISSION.UNKNOWN`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    AssetConflict:
      description: '`ASSET.NOT_READY` when the lifecycle state forbids the operation, or `ASSET.IDEMPOTENCY_CONFLICT`
        when an idempotency key is reused with different metadata.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUploadExpired:
      description: '`ASSET.UPLOAD_EXPIRED`: the pending upload lifetime elapsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTooLarge:
      description: '`ASSET.SIZE_EXCEEDED` when declared, transferred, or stored size violates the asset
        policy, or `COMMON.REQUEST_TOO_LARGE` when the global body limit rejects the request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUnprocessable:
      description: '`ASSET.INVALID_MEDIA_TYPE`: an unsupported or inconsistent name, media type, or content.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or belongs to another scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: the value is null, not a supported scalar, violates the definition,
        or the body has unknown fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidRequest:
      description: '`COMMON.INVALID_INPUT`: malformed, weak, wildcard, or multiple `If-Match` validators,
        or malformed/trailing JSON.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UsageForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may read organization usage.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may manage webhooks.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointNotFound:
      description: '`WEBHOOK.ENDPOINT_NOT_FOUND` for an endpoint outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointVersionConflict:
      description: '`WEBHOOK.ENDPOINT_VERSION_CONFLICT`: the `If-Match` version is stale.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookUnprocessable:
      description: '`WEBHOOK.INVALID_EVENT_TYPE` or `WEBHOOK.INVALID_TARGET`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookTestConflict:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED` when the endpoint is disabled or not subscribed to `webhook.test`,
        or `WEBHOOK.IDEMPOTENCY_CONFLICT`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetNotFound:
      description: '`ASSET.NOT_FOUND` for an absent, deleted, or foreign asset; a non-UUID path also returns
        404.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTransferNotFound:
      description: '`ASSET.NOT_FOUND`: the token is invalid, expired, for another operation, the asset
        is gone, or the local driver is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookDeliveryNotFound:
      description: '`WEBHOOK.DELIVERY_NOT_FOUND` for a delivery outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorForbidden:
      description: '`AUTH.ACCOUNT_DISABLED`, `OPERATOR.FORBIDDEN` (no current operator grant), `OPERATOR.ORIGIN_REJECTED`,
        or `OPERATOR.CSRF_REJECTED` on unsafe methods.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignInForbidden:
      description: '`OPERATOR.ORIGIN_REJECTED` when `Origin` is missing or not allowed, or `OPERATOR.FORBIDDEN`
        when valid credentials belong to an account without an operator grant.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignOutRejected:
      description: '`OPERATOR.ORIGIN_REJECTED` or `OPERATOR.CSRF_REJECTED` when a session cookie is presented.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorInvalidCredentials:
      description: '`AUTH.INVALID_CREDENTIALS` for unknown, wrong, or disabled accounts.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorTargetProtected:
      description: '`OPERATOR.TARGET_PROTECTED`: the target account holds an operator grant, including
        the caller''s own.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorUserNotFound:
      description: '`USER.NOT_FOUND`, or `COMMON.NOT_FOUND` when the path ID is not all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorOrganizationNotFound:
      description: '`ORGANIZATION.NOT_FOUND` for an unknown organization, `WEBHOOK.DELIVERY_NOT_FOUND`
        for a delivery outside the organization, or `COMMON.NOT_FOUND` when a constrained path ID is not
        all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or not app-scoped.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: unknown fields, `null`, or a value outside the definition
        schema.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorWebhookReplayNotAllowed:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED`: the delivery is not terminal, reached the replay limit,
        or its endpoint is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
