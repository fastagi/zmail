        - text/csv
      description: Media types the starter asset policy accepts.
    MailDirection:
      type: string
      enum:
        - inbound
        - outbound
    MailStatus:
      type: string
      description: '`received` for inbound messages. Outbound messages are `queued` while the provider
        call is in flight, then `sent` or `failed`.'
      enum:
        - received
        - queued
        - sent
        - failed
    MailboxDomain:
      type: object
      additionalProperties: false
      required:
        - domain
        - kind
        - max_mailboxes
        - provider
        - inbound_enabled
        - daily_send_limit
        - daily_broadcast_limit
        - daily_transactional_limit
        - transactional_enabled
        - transactional_recipient_limit_per_minute
        - transactional_key_limit_per_second
        - simulator_domain
        - broadcasts_enabled
        - custom_domains_enabled
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 253
        kind:
          type: string
          description: '`shared` is the instance domain every organization may use; `organization` is a verified
            domain the organization connected.'
          enum:
            - shared
            - organization
        max_mailboxes:
          type: integer
          description: '`MAILBOX_MAX_PER_ORGANIZATION`, the mailboxes one organization may own (default 50).'
          minimum: 1
          maximum: 5000
        provider:
          type: string
          description: Outbound transport. `cloudflare` delivers mail; `log` only records it and exists for development.
          enum:
            - cloudflare
            - log
        inbound_enabled:
          type: boolean
          description: Whether the API accepts signed deliveries from the mail edge.
        daily_send_limit:
          type: integer
          description: The personal lane limit. Personal messages (console sends, replies, `outbound-mail-messages`,
            and template test sends) one organization may attempt per rolling 24 hours.
          minimum: 1
        daily_broadcast_limit:
          type: integer
          description: The broadcast lane limit. Broadcast recipients one organization may attempt per rolling 24 hours.
          minimum: 1
        daily_transactional_limit:
          type: integer
          description: The transactional lane limit. Live, non-simulated transactional messages one organization may
            attempt per rolling 24 hours.
          minimum: 1
        transactional_enabled:
          type: boolean
          description: Whether the instance accepts transactional messages (`MAILBOX_TRANSACTIONAL_ENABLED`).
            Instance-wide, repeated on every item.
        transactional_recipient_limit_per_minute:
          type: integer
          description: Transactional messages one organization may send from one template to one recipient in
            one mode per minute.
          minimum: 1
        transactional_key_limit_per_second:
          type: integer
          description: Transactional messages one API key may send per second.
          minimum: 1
        simulator_domain:
          type: string
          description: The domain whose addresses are simulated instead of sent (`delivered@`, `bounced@`,
            `soft-bounced@`, `complained@`, `suppressed@`, each with an optional `+tag`).
          minLength: 1
          maxLength: 253
        broadcasts_enabled:
          type: boolean
          description: Whether broadcasts can be sent. Unsubscribe links need `MAILBOX_INBOUND_SECRET` and `MAILBOX_PUBLIC_URL`.
        custom_domains_enabled:
          type: boolean
          description: Whether owners and admins may connect their own domains. Instance-wide, repeated on every item.
    MailboxDomainListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          description: The shared domain first, then the organization's verified domains.
          minItems: 1
          maxItems: 11
          items:
            $ref: '#/components/schemas/MailboxDomain'
    Mailbox:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - display_name
        - type
        - owner_user_id
        - awaiting_handover
        - sealed_before
        - webhooks_enabled
        - ai_triage_enabled
        - access
        - unread_count
        - created_at
        - role_id
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        address:
          type: string
          minLength: 3
          maxLength: 320
        display_name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/MailboxType'
        owner_user_id:
          description: The owner of a personal mailbox; null for a shared one or a personal one whose owner left.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
        awaiting_handover:
          type: boolean
          description: True while a personal mailbox's owner has left the organization and nobody has taken
            it over.
        sealed_before:
          description: Messages and broadcasts created before this instant are sealed and invisible on every
            surface; set once at handover, null when nothing is sealed.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        webhooks_enabled:
          type: boolean
          description: Whether mail webhooks are published for this mailbox; always false for a personal one.
        ai_triage_enabled:
          type: boolean
          description: Whether new inbound mail of this mailbox is queued for AI triage. Triage also needs
            the organization switch; handover turns it off.
        access:
          $ref: '#/components/schemas/MailboxAccess'
        unread_count:
          type: integer
          description: Number of inbound messages in the `default` placement (the Inbox) after the seal
            boundary that the caller has not read; 0 for a caller without `view`.
          minimum: 0
        created_at:
          type: string
          format: date-time
        role_id:
          description: The mail role the mailbox belongs to; null when it has none. A mail role groups
            mailboxes for navigation and grants nothing.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
    CreateMailboxRequest:
      type: object
      additionalProperties: false
      required:
        - local_part
      properties:
        local_part:
          type: string
          description: Lowercase letters and digits with inner dots, underscores, or hyphens. Role addresses
            such as `postmaster` are reserved.
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          maxLength: 120
        domain:
          type: string
          description: A verified domain of the organization. Empty or absent means the shared domain.
          maxLength: 253
        type:
          $ref: '#/components/schemas/MailboxType'
        owner_user_id:
          description: Required for a personal mailbox; must be absent for a shared one.
          allOf:
            - $ref: '#/components/schemas/PositiveID'
        members:
          type: array
          description: Required for a shared mailbox, 1 to 100 distinct users; must be absent for a personal one.
          maxItems: 100
          items:
            $ref: '#/components/schemas/MailboxMemberRequest'
    MailboxType:
      type: string
      description: '`external` mailboxes hold read-only copies of a bound outside account; only the member
        who bound it reads them and nobody sends from them. They are never created, filtered, or exported
        by type through these routes, which accept `personal` and `shared` only.'
      enum:
        - personal
        - shared
        - external
