  /v1/mail-domains:
    get:
      operationId: listMailDomains
      summary: List the domains the organization connected
      description: Answers `404 MAILBOX.DOMAINS_DISABLED` unless the instance sets `MAILBOX_CUSTOM_DOMAINS_ENABLED=true`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: Every connected domain by name, with the records of its last check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: connectMailDomain
      summary: Connect a domain and set it up
      description: The domain must be a zone, or a subdomain of a zone, that the instance's Cloudflare token
        can manage. Zmail enables Email Routing and Email Sending for it and adds the sending and DMARC
        records the zone lacks; it never edits or deletes existing records. The setup runs in the background, so
        the answer is `201` at once with the domain pending and `setting_up` true, and a failed step later shows
        in `last_error`. Only owners and admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailDomainRequest'
      responses:
        '201':
          description: The connected domain after its first setup and check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The domain is already connected by an organization, or is the shared domain (`MAILBOX.DOMAIN_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A field failed validation, the name is not a usable domain (`MAILBOX.DOMAIN_INVALID`), no
            zone the token can manage contains it (`MAILBOX.DOMAIN_ZONE_NOT_FOUND`), or the organization has
            10 domains (`MAILBOX.DOMAIN_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The DNS provider refused the zone lookup (`MAILBOX.DOMAIN_PROVIDER_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-domains/{domain_id}:
