  /v1/operator/outbound-messages/{organization_id}/{message_id}/content:
    post:
      operationId: readOperatorBroadcastContent
      summary: Read the sent text of one organization broadcast message, with a reason
      description: Needs `mail_content:read`, which no scope includes; a grant gets it only through
        the explicit content add-on. Only an outbound message created by a broadcast of the same
        organization is readable. The access record (viewer, organization, message, reason, time)
        is stored before the body is loaded, in the same transaction; if it cannot be stored the
        response is `503` and carries no body. Returns plain text only; an HTML-only message is
        converted to readable text without fetching anything. Never HTML, images, attachments, or
        recipients.
      tags:
        - Operator
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrganizationID'
        - name: message_id
          in: path
          required: true
          description: Positive message identifier; must belong to `organization_id`.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorBroadcastContentRequest'
      responses:
        '200':
          description: The sent text. The access record already exists.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorBroadcastContentResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorContentForbidden'
        '404':
          $ref: '#/components/responses/OperatorMessageNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
