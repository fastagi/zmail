            - type: 'null'
    MailAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - content_type
        - size
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        filename:
          type: string
          description: Bare file name without a path.
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          description: Media type the sender declared. It is untrusted and never used to serve the file.
          minLength: 1
          maxLength: 127
        size:
          type: integer
          description: Size in bytes.
          minimum: 0
          maximum: 4194304
