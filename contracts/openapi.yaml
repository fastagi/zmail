          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMailDomain
      summary: Remove a connected domain
      description: Allowed only when no mailbox uses the domain. Zmail forgets the domain and leaves its DNS
        and Cloudflare settings as they are. Only owners and admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
