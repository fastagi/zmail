  /v1/mail-domains:
    get:
      operationId: listMailDomains
      summary: List the domains the organization connected
      description: Answers `404 MAILBOX.DOMAINS_DISABLED` unless the instance sets `MAILBOX_CUSTOM_DOMAINS_ENABLED=true`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: Every connected domain by name, with the records of its last check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: connectMailDomain
      summary: Connect a domain and set it up
      description: The domain goes into the organization's managed zone for its apex, else a zone or parent
        zone the instance's Cloudflare token can manage, else a new managed zone Zmail creates for the apex,
        which stays pending until the registrar delegates it. In a zone Cloudflare serves, Zmail enables Email
        Routing (unless `capability` is `send_only`) and Email Sending and adds the sending and DMARC records the
        zone lacks; it never edits or deletes existing records. The setup runs in the background, so the answer is
        `201` at once with the domain pending and `setting_up` true, and a failed step later shows in
        `last_error`. Only owners and admins may.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailDomainRequest'
      responses:
        '201':
          description: The connected domain after its first setup and check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The domain is already connected by an organization, is the shared domain, or its apex is
            another organization's managed zone or held by another Cloudflare account (`MAILBOX.DOMAIN_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A field failed validation, the name is not a usable domain (`MAILBOX.DOMAIN_INVALID`), the
            organization has 10 domains (`MAILBOX.DOMAIN_LIMIT_REACHED`), or a new managed zone would exceed the
            organization's zone limit (`MAILBOX.ZONE_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The DNS provider refused the zone lookup or creation (`MAILBOX.DOMAIN_PROVIDER_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mail-domains/{domain_id}:
    get:
      operationId: getMailDomain
      summary: Get a connected domain
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailDomainID'
      responses:
        '200':
          description: The domain with the records of its last check.
          content:
