      type: object
      additionalProperties: false
      required:
        - current_page
        - per_page
        - total
        - last_page
        - from
        - to
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0
