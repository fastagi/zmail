          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailbox-directory:
    get:
      operationId: listMailboxDirectory
      summary: List the organization's mailboxes for administration
      description: Needs the `owner` or `admin` organization role. Keyset pages of mailbox metadata, newest
        first, each with its member count and its 24-hour send attempts; never message content, unread
        counts, or the caller's access. Pass `meta.next_cursor` as `cursor` for the next, older page.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: type
          in: query
          description: Only mailboxes of this type; absent lists both.
          schema:
            $ref: '#/components/schemas/MailboxType'
        - name: q
          in: query
          description: A case-insensitive substring of the address or display name, 1 to 120 characters after
            trimming. `%`, `_`, and `\` match themselves.
          schema:
            type: string
            maxLength: 120
        - name: cursor
          in: query
          description: Opaque keyset position from `meta.next_cursor`; absent or empty requests the newest page.
          schema:
            type: string
            maxLength: 128
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxDirectoryPageResponse'
        '400':
          description: The cursor is malformed or `page` was sent (`COMMON.INVALID_INPUT`); or the organization
            header is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailbox-imports:
    post:
      operationId: importMailboxes
      summary: Validate or create shared mailboxes from spreadsheet rows
      description: Needs the `owner` or `admin` organization role. Each row is checked exactly like `POST
        /v1/mailboxes`; with `dry_run` nothing is created. A real run creates every row that passes, each in its
        own transaction, so a failed row never undoes another. No organization invitation is sent.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxImportRequest'
      responses:
        '200':
          description: The outcome of every row, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxImportResultResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailbox-exports:
    get:
      operationId: exportMailboxes
      summary: Download the organization's mailboxes of one type as CSV
      description: Needs the `owner` or `admin` organization role. The only surface that carries member email
        addresses; columns match the import template plus counts and the creation time.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MailboxType'
      responses:
        '200':
          description: A UTF-8 CSV file with a byte order mark, at most 5000 data rows.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
                const: private, no-store
            Content-Disposition:
              description: '`attachment; filename="shared-mailboxes-YYYYMMDD.csv"` (or `personal-mailboxes-…`),
                dated in UTC.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes:
    get:
      operationId: listMailboxes
      summary: List the organization's mailboxes
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - name: scope
          in: query
          description: '`usable` lists only the mailboxes the caller can read or send from, plus, for owners and
            admins, personal mailboxes awaiting handover. Absent lists every mailbox the caller has any access
            to.'
          schema:
            type: string
            enum:
              - usable
      responses:
        '200':
          description: The mailboxes the caller has any access to, oldest first. Owners and admins see every
            mailbox's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxListResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createMailbox
      summary: Create a mailbox on the configured domain
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailboxRequest'
      responses:
        '201':
          description: The created mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The address is taken (`MAILBOX.ADDRESS_TAKEN`) or the caller owns the maximum number of
            mailboxes (`MAILBOX.LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, the local part is invalid (`MAILBOX.ADDRESS_INVALID`) or
            a role address on the shared domain (`MAILBOX.ADDRESS_RESERVED`), the named domain is still pending
            (`MAILBOX.DOMAIN_NOT_VERIFIED`), or the type, owner, or members are invalid
            (`MAILBOX.ACCESS_INVALID`). A domain the organization did not connect is `404
            MAILBOX.DOMAIN_NOT_FOUND`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloudflare refused the routing rule for an address on an organization domain (`MAILBOX.DOMAIN_PROVIDER_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}:
