  /v1/operator/audit-logs:
    get:
      operationId: listOperatorAuditLogs
      summary: List platform-wide audit history, newest first
      description: '`to` defaults to now and `from` to 30 days before `to`; the range must be ordered
        and at most 92 days. Keyset pages: pass `meta.next_cursor` as `cursor` for the next, older page.'
      tags:
        - Operator
      security:
        - operatorSession: []
      parameters:
        - name: from
          in: query
          description: Inclusive RFC 3339 lower bound.
          schema:
            type: string
            format: date-time
            maxLength: 40
        - name: to
          in: query
          description: Exclusive RFC 3339 upper bound.
          schema:
            type: string
            format: date-time
            maxLength: 40
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 120
        - name: resource
          in: query
          schema:
            type: string
            maxLength: 180
        - name: method
          in: query
          schema:
            type: string
            maxLength: 10
        - name: request_id
          in: query
          schema:
            type: string
            maxLength: 80
        - name: status_code
          in: query
          schema:
            type: integer
            minimum: 100
            maximum: 599
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One keyset page of audit entries.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                # A one-member oneOf is equivalent to the $ref; it keeps oasdiff reading the removal of
                # the deprecated offset shape as a narrowed response rather than a changed type.
                oneOf:
                  - $ref: '#/components/schemas/AuditLogCursorPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorForbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
