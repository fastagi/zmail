    FieldErrors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        error:
          type: string
        request_id:
          type: string
          minLength: 1
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
        - errors
      properties:
        code:
          const: 422
        error_code:
          const: COMMON.VALIDATION_FAILED
        message:
          type: string
        errors:
          $ref: '#/components/schemas/FieldErrors'
        request_id:
          type: string
          minLength: 1
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - current_page
        - per_page
        - total
        - last_page
        - from
        - to
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0
    PaginationLinks:
      type: object
      additionalProperties: false
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type:
            - string
            - 'null'
        next:
          type:
            - string
            - 'null'
    APIKey:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - name
        - key_prefix
        - scopes
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        user_id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          minLength: 1
          maxLength: 100
        key_prefix:
          type: string
          description: Issued with the `fastbuild_` prefix; keys created before the rename keep their original lowercase prefix.
          pattern: ^[a-z][a-z0-9]*_[a-z0-9_-]+$
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: ^(?:\*|[a-z][a-z0-9_-]{0,31}:[a-z][a-z0-9_-]{0,31})$
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 65
        expires_at:
          type: string
          format: date-time
    CreateAPIKeyResult:
      type: object
      additionalProperties: false
      required:
        - api_key
        - plaintext_key
      properties:
        api_key:
          $ref: '#/components/schemas/APIKey'
        plaintext_key:
          type: string
          minLength: 16
          maxLength: 512
    CreateAPIKeyResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/CreateAPIKeyResult'
    APIKeyPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - meta
        - links
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    HealthStatus:
      type: string
      enum:
        - up
        - degraded
        - down
    HealthLivenessProbe:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: up
    HealthReadinessProbe:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - up
            - degraded
    HealthProbe:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
    HealthCheckResult:
      type: object
      additionalProperties: false
      required:
        - status
        - latency_ms
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        latency_ms:
          type: integer
          minimum: 0
          description: Check wall time in whole milliseconds.
        timestamp:
          type: string
          format: date-time
    HealthReport:
      type: object
      additionalProperties: false
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheckResult'
    AuthenticationUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        username:
          type: string
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        phone:
          type: string
        bio:
          type: string
        status:
          type: integer
          description: 0 disabled, 1 active, 2 pending, 3 banned.
          enum:
            - 0
            - 1
            - 2
            - 3
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
