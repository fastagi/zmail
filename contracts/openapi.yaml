        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/mailboxes/{mailbox_id}/messages:
    get:
      operationId: listMailMessages
      summary: List the messages of a mailbox, newest first
      description: Needs `view`. Without `placement` every placement except `trash` is listed. Without
        `group` each item is one message. With `group=thread` each item is the latest message of one
        thread in the view and carries `thread` with the thread's count, unread, starred, and labels in
        that view. Filters combine with AND. An invalid combination is `400 COMMON.INVALID_INPUT`; see the
        mailbox contract for the rules.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - name: direction
          in: query
          required: false
          description: Keep only received (`inbound`) or sent (`outbound`) messages. With `placement=default`,
            `inbound` is the Inbox and `outbound` is Sent.
          schema:
            $ref: '#/components/schemas/MailDirection'
        - name: placement
          in: query
          required: false
          description: Keep only one placement. Without it every placement except `trash` is listed.
            `folder` needs `folder_id`.
          schema:
            $ref: '#/components/schemas/MailPlacement'
        - name: folder_id
          in: query
          required: false
          description: The folder to list; only with `placement=folder`, which requires it. A folder that is
            not the mailbox's is `404 MAILBOX.FOLDER_NOT_FOUND`.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: label_id
          in: query
          required: false
          description: Keep only messages with this label. A label that is not the mailbox's is
            `404 MAILBOX.LABEL_NOT_FOUND`.
          schema:
            $ref: '#/components/schemas/PositiveID'
        - name: starred
          in: query
          required: false
          description: Keep only messages the caller starred (`true`) or did not star (`false`).
          schema:
            type: boolean
        - name: unread
          in: query
          required: false
          description: '`true` keeps only inbound messages the caller has not read (`read` is `false`); outbound
            messages are always read and never match. `false` keeps the others (`read` is `true`). Read state
            is the caller''s own.'
          schema:
            type: boolean
        - name: has_attachments
          in: query
          required: false
          description: Keep only messages with (`true`) or without (`false`) attached files.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Search. At most 200 characters as sent; the value is then trimmed, and one that is
            empty after trimming or contains a control character is `400 COMMON.INVALID_INPUT`. Case-insensitive substring match on the subject, the sender address and
            name, the `to` and `cc` addresses, and the text body; `%` and `_` match literally. Searches
            every placement except `trash`. A search the database cannot finish within 2 seconds is
            `422 MAILBOX.SEARCH_TOO_BROAD`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: group
          in: query
          required: false
          description: '`thread` lists one item per thread. Only with `placement` `default`, `archive`, or
            `folder`, and without `label_id`, `starred`, `unread`, `has_attachments`, and `q`. With
            `placement=default` it also needs `direction` (`inbound` is the Inbox, `outbound` is Sent).'
          schema:
            type: string
            enum:
              - thread
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of message summaries without bodies, newest first by id; the trash is ordered
            by `trashed_at`, newest first, then by id, highest first. With `group=thread`, one page of threads,
            each as its latest message in the view, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessagePageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The mailbox (`MAILBOX.NOT_FOUND`), the folder (`MAILBOX.FOLDER_NOT_FOUND`), or the
            label (`MAILBOX.LABEL_NOT_FOUND`) is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The search could not finish within 2 seconds; a longer `q` is needed
            (`MAILBOX.SEARCH_TOO_BROAD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: sendMailMessage
      summary: Send a message from a mailbox
      description: The message is stored, handed to the mail provider, and returned with its real outcome.
        When the provider does not accept it the response is `502 MAILBOX.DELIVERY_FAILED` and the
        message stays in the mailbox with status `failed`.
      tags:
        - Mailboxes
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
        - $ref: '#/components/parameters/MailboxID'
        - $ref: '#/components/parameters/MailIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMailMessageRequest'
      responses:
        '200':
          description: The `Idempotency-Key` already named a sent message; it is returned and nothing is sent again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '201':
          description: The provider accepted the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '202':
          description: The organization reached the rolling 24-hour send limit; the message is stored as queued with `queued_reason` `send_limit` and is sent when the limit has room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The `Idempotency-Key` was used with different content or matches a sealed message
            (`MAILBOX.IDEMPOTENCY_CONFLICT`, with no message data), or its first attempt has not finished
            (`MAILBOX.SEND_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: A field failed validation, the recipients, subject, body, or reply reference are
            unusable (`MAILBOX.MESSAGE_INVALID`), the `Idempotency-Key` is not 1 to 255 printable
            ASCII characters (`MAILBOX.IDEMPOTENCY_KEY_INVALID`), or the template is transactional
            (`MAILBOX.TEMPLATE_KIND_MISMATCH`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The send limit is full and as many messages already wait as the limit allows (`MAILBOX.SEND_LIMIT_REACHED`); nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The mail provider did not accept the message (`MAILBOX.DELIVERY_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
