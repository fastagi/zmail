            - type: 'null'
        mailbox_id:
          description: A live mailbox of the organization, or null. Defaults to null.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
        owner_user_id:
          description: A current member of the organization, or null. Defaults to null.
          oneOf:
            - $ref: '#/components/schemas/PositiveID'
            - type: 'null'
        status:
