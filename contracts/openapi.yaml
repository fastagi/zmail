          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MailDNSRecordInvalidResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cloudflare could not list the zone's records (`MAILBOX.DOMAIN_PROVIDER_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
