            minLength: 3
            maxLength: 320
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    SendMailMessageRequest:
      type: object
      description: Give `subject` with `text` or `html`, or give `template` and none of the three.
      additionalProperties: false
      required:
