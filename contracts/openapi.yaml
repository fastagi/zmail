      properties:
        to:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 3
            maxLength: 320
        cc:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 3
            maxLength: 320
        subject:
          type: string
          minLength: 1
          maxLength: 998
        text:
          type: string
          description: Plain-text body. At least one of `text` and `html` is required.
          maxLength: 262144
        html:
          type: string
          maxLength: 262144
        in_reply_to:
          type: string
          description: Message-ID of the message this one answers, with or without angle brackets.
          maxLength: 900
        attachments:
          type: array
          description: Optional files to send with the message.
          maxItems: 10
          items:
