    MailTemplateSendInput:
      type: object
      additionalProperties: false
      description: Sends a stored template in place of `subject`, `text`, and `html`. Only these values fill
        variables; sample values are never used for a real send.
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        variables:
          $ref: '#/components/schemas/MailTemplateVariables'
    MailTemplateVariables:
      type: object
      description: Values by variable name; names are a letter followed by letters, digits, or underscores.
      maxProperties: 100
      propertyNames:
        pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
      additionalProperties:
        type: string
        maxLength: 2000
    MailTemplateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - subject
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        subject:
          type: string
          description: May use `{{name}}` and `{{name|fallback}}` placeholders, as may both bodies.
          minLength: 1
          maxLength: 998
        html:
          type: string
          description: At least one of `html` and `text` is required.
          maxLength: 262144
        text:
          type: string
          maxLength: 262144
        sample_variables:
          $ref: '#/components/schemas/MailTemplateVariables'
        design:
          $ref: '#/components/schemas/MailTemplateDesign'
    MailTemplateDesign:
      type:
        - object
        - 'null'
      description: The visual editor's document that `html` and `text` were rendered from, stored
        as given. The API checks only that it is an object of at most 256 KiB with a positive integer
        `version`; sending always uses the bodies. Null or absent means the template is written in
        HTML, and a replace without it clears the stored design.
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
      additionalProperties: true
    MailTemplateSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - subject
        - variables
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          maxLength: 100
        subject:
          type: string
          maxLength: 998
        variables:
          type: array
          description: Every variable the template uses, sorted.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MailTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - subject
        - variables
        - created_at
        - updated_at
        - html_body
        - text_body
        - sample_variables
        - design
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          maxLength: 100
        subject:
          type: string
          maxLength: 998
        variables:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        html_body:
          type: string
          maxLength: 262144
        text_body:
          type: string
          maxLength: 262144
        sample_variables:
          $ref: '#/components/schemas/MailTemplateVariables'
        design:
          $ref: '#/components/schemas/MailTemplateDesign'
    MailTemplateResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          const: 0
        message:
          type: string
        data:
          $ref: '#/components/schemas/MailTemplate'
    MailTemplateListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
