  /v1/cloudflare-connections/{connection_id}/inbound-mail-messages:
    post:
      operationId: receiveOrganizationInboundMessage
      summary: Accept a signed message from an organization Worker
      description: The callback authenticates the connection-specific signature and accepts mail only for
        this organization and connection.
      tags:
      - Mailboxes
      security: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Mailbox-Signature
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-Mailbox-Recipient
        in: header
        required: true
        description: The envelope recipient the edge accepted the message for.
        schema:
          type: string
          minLength: 3
          maxLength: 320
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          description: The message was already stored by an earlier delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '201':
          description: The message is stored in the recipient's mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailMessageResponse'
        '401':
          description: The signature is missing, stale, or wrong (`MAILBOX.INBOUND_SIGNATURE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No mailbox has the recipient address (`MAILBOX.RECIPIENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The raw message exceeds 5 MiB (`MAILBOX.INBOUND_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body is not a parseable message with a sender (`MAILBOX.INBOUND_UNPARSEABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Inbound mail has no shared secret configured (`MAILBOX.INBOUND_DISABLED`), or the
            database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
